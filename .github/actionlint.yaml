# actionlint 1.7.10 predates GitHub's hosted xcode-27 label.
# https://github.com/actions/runner-images/blob/main/README.md
paths:
  .github/workflows/apple-validation.yml:
    ignore:
      - 'label "xcode-27" is unknown'
  # These inherited workflow snippets are valid shell; actionlint cannot see
  # step env declarations or intentionally literal jq/summary strings.
  .github/workflows/cli-release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2153:'
  .github/workflows/server-deploy.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:'
