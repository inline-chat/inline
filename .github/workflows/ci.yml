name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  codex-plugin:
    name: Codex plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Check plugin bundle
        run: bun run check:codex-plugin

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler systemd

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CLI, including generated systemd units
        run: bun run --cwd cli ci

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build MCP dependencies
        run: |
          bun run --cwd packages/protocol build
          bun run --cwd packages/oauth-core build
          bun run --cwd sdk build

      - name: Check MCP
        run: bun run --cwd mcp typecheck

      - name: Build MCP
        run: bun run --cwd mcp build

      - name: Lint MCP
        run: bun run --cwd mcp lint

      - name: Test MCP
        run: bun run --cwd mcp test

  openclaw:
    name: OpenClaw (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["2026.8.2", "2026.9.1", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenClaw dependencies
        run: |
          bun run --cwd packages/protocol build
          bun run --cwd packages/oauth-core build
          bun run --cwd packages/bot-api-types build
          bun run --cwd sdk build

      - name: Check OpenClaw
        if: matrix.host == 'latest'
        run: bun run --cwd openclaw check

      - name: Install compatibility host
        env:
          OPENCLAW_VERSION: ${{ matrix.host }}
        run: |
          host_dir="$RUNNER_TEMP/inline-openclaw-host"
          mkdir -p "$host_dir"
          bun -e 'await Bun.write(process.argv[1], JSON.stringify({private: true, dependencies: {openclaw: process.env.OPENCLAW_VERSION}}))' "$host_dir/package.json"
          bun install --cwd "$host_dir" --ignore-scripts

      - name: Check released host source and packed runtime
        run: bun run --cwd openclaw check:host "$RUNNER_TEMP/inline-openclaw-host/node_modules/openclaw"
