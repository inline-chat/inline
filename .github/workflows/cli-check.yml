name: CLI Build

on:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "crates/**"
      - "vendor/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "proto/core.proto"
      - "scripts/ci/public-workspaces-ref"
      - "scripts/release-cli.ts"
      - "scripts/ci/test-cli-installer.py"
      - ".github/workflows/cli-check.yml"
      - ".github/workflows/cli-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cli/**"
      - "crates/**"
      - "vendor/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "proto/core.proto"
      - "scripts/ci/public-workspaces-ref"
      - "scripts/release-cli.ts"
      - "scripts/ci/test-cli-installer.py"
      - ".github/workflows/cli-check.yml"
      - ".github/workflows/cli-release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure public workspaces
        run: bash scripts/ci/ensure-public-workspaces.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Linux musl Toolchain
        working-directory: cli
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Linux musl
        working-directory: cli
        run: cargo build --locked --target "${{ matrix.target }}"

      - name: Smoke static Linux CLI
        run: |
          target/${{ matrix.target }}/debug/inline --version
          target/${{ matrix.target }}/debug/inline capabilities agents setup --compact

      - name: Test installer with Debian sh
        run: python3 scripts/ci/test-cli-installer.py
