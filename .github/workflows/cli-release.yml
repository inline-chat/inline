name: CLI Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release from"
        required: true
        default: "main"
      targets:
        description: "Optional comma-separated release targets override"
        required: false
        default: ""
      skip_notarize:
        description: "Skip macOS notarization and publish signed-only CLI binaries"
        required: false
        default: false
        type: boolean
      build_only:
        description: "Build and upload workflow artifacts without publishing a release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Preflight
        env:
          TARGETS_OVERRIDE: ${{ github.event.inputs.targets }}
          INLINE_HOMEBREW_TAP_TOKEN: ${{ secrets.INLINE_HOMEBREW_TAP_TOKEN }}
          PUBLIC_RELEASES_R2_ACCESS_KEY_ID: ${{ secrets.PUBLIC_RELEASES_R2_ACCESS_KEY_ID }}
          PUBLIC_RELEASES_R2_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_RELEASES_R2_SECRET_ACCESS_KEY }}
          PUBLIC_RELEASES_R2_BUCKET: ${{ secrets.PUBLIC_RELEASES_R2_BUCKET }}
          PUBLIC_RELEASES_R2_ENDPOINT: ${{ secrets.PUBLIC_RELEASES_R2_ENDPOINT }}
          PUBLIC_RELEASES_R2_PUBLIC_BASE_URL: ${{ secrets.PUBLIC_RELEASES_R2_PUBLIC_BASE_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          INLINE_SKIP_NOTARIZE: ${{ github.event.inputs.skip_notarize }}
          BUILD_ONLY: ${{ github.event.inputs.build_only }}
        run: |
          set -euo pipefail
          release_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${release_version}" ]]; then
            echo "Could not read CLI workspace version." >&2
            exit 1
          fi
          prerelease=false
          if [[ "${release_version}" == *-* ]]; then
            prerelease=true
          fi
          supported=(
            aarch64-apple-darwin
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          )
          if [[ -n "${TARGETS_OVERRIDE}" ]]; then
            IFS=',' read -ra requested <<< "${TARGETS_OVERRIDE}"
            for raw in "${requested[@]}"; do
              target="$(echo "${raw}" | xargs)"
              found=0
              for supported_target in "${supported[@]}"; do
                if [[ "${target}" == "${supported_target}" ]]; then
                  found=1
                  break
                fi
              done
              if [[ "${found}" -ne 1 ]]; then
                echo "Unsupported target: ${target}" >&2
                exit 1
              fi
            done
          fi

          build_only=false
          if [[ "${BUILD_ONLY}" == "true" || "${BUILD_ONLY}" == "1" ]]; then
            build_only=true
          fi

          required=()
          if [[ "${build_only}" != "true" ]]; then
            required+=(
              PUBLIC_RELEASES_R2_ACCESS_KEY_ID
              PUBLIC_RELEASES_R2_SECRET_ACCESS_KEY
              PUBLIC_RELEASES_R2_BUCKET
              PUBLIC_RELEASES_R2_ENDPOINT
              PUBLIC_RELEASES_R2_PUBLIC_BASE_URL
            )
          fi
          if [[ -z "${TARGETS_OVERRIDE}" || "${TARGETS_OVERRIDE}" == *apple-darwin* ]]; then
            required+=(
              MACOS_CERTIFICATE
              MACOS_CERTIFICATE_PWD
              MACOS_CERTIFICATE_NAME
              MACOS_CI_KEYCHAIN_PWD
            )
            if [[ "${build_only}" != "true" && "${prerelease}" != "true" ]]; then
              required+=(INLINE_HOMEBREW_TAP_TOKEN)
            fi
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          skip_notarize=false
          if [[ "${INLINE_SKIP_NOTARIZE}" == "true" || "${INLINE_SKIP_NOTARIZE}" == "1" ]]; then
            skip_notarize=true
          fi

          if [[ -z "${TARGETS_OVERRIDE}" || "${TARGETS_OVERRIDE}" == *apple-darwin* ]]; then
            has_api_key=false
            if [[ -n "${APPLE_NOTARIZATION_KEY:-}" && -n "${APPLE_NOTARIZATION_KEY_ID:-}" && -n "${APPLE_NOTARIZATION_ISSUER:-}" ]]; then
              has_api_key=true
            fi
            has_apple_id=false
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
              has_apple_id=true
            fi
            if [[ "${skip_notarize}" != "true" && "${has_api_key}" != "true" && "${has_apple_id}" != "true" ]]; then
              echo "Missing notarization credentials: provide APPLE_NOTARIZATION_KEY, APPLE_NOTARIZATION_KEY_ID, APPLE_NOTARIZATION_ISSUER or APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID" >&2
              exit 1
            fi
          fi

      - name: Verify Published Agent Setup Release Group
        if: ${{ github.event.inputs.build_only != 'true' }}
        run: node scripts/check-agent-release-group.mjs

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Clone Homebrew Tap for Validation
        run: git clone --depth 1 https://github.com/inline-chat/homebrew-inline.git homebrew-inline

      - name: Validate Agent Setup Release Group
        env:
          INLINE_HOMEBREW_TAP_PATH: ${{ github.workspace }}/homebrew-inline
        run: |
          set -euo pipefail
          bun test scripts/release-cli.test.ts
          bun run scripts/release-cli.ts validate-homebrew
          node scripts/check-agent-release-group.mjs --source-only
          bun run --cwd packages/protocol build
          bun run --cwd sdk build
          bun run --cwd openclaw check
          bun run --cwd hermes-agent check
          bun run --cwd cli ci

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl

    steps:
      - name: Select Target
        id: target
        env:
          TARGETS_OVERRIDE: ${{ github.event.inputs.targets }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          selected=false
          if [[ -z "${TARGETS_OVERRIDE}" ]]; then
            selected=true
          else
            IFS=',' read -ra requested <<< "${TARGETS_OVERRIDE}"
            for raw in "${requested[@]}"; do
              target="$(echo "${raw}" | xargs)"
              if [[ "${target}" == "${TARGET}" ]]; then
                selected=true
                break
              fi
            done
          fi
          echo "selected=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${TARGET}: ${selected}"

      - name: Checkout
        if: steps.target.outputs.selected == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Bun
        if: steps.target.outputs.selected == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Setup Rust
        if: steps.target.outputs.selected == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        if: steps.target.outputs.selected == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust builds
        if: steps.target.outputs.selected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup Zig
        if: steps.target.outputs.selected == 'true'
        uses: mlugg/setup-zig@v2

      - name: Install Linux Toolchain
        if: steps.target.outputs.selected == 'true'
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y qemu-user libc6-arm64-cross
          cargo install cargo-zigbuild --version 0.21.8 --locked

      - name: Build Target
        if: steps.target.outputs.selected == 'true'
        env:
          INLINE_CLI_TARGETS: ${{ matrix.target }}
          INLINE_CLI_SENTRY_DSN: ${{ secrets.INLINE_CLI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          test -n "${INLINE_CLI_SENTRY_DSN}" || { echo "Missing INLINE_CLI_SENTRY_DSN release configuration" >&2; exit 1; }
          bun run scripts/release-cli.ts build

      - name: Validate Target Binary
        if: steps.target.outputs.selected == 'true'
        env:
          TARGET: ${{ matrix.target }}
          INLINE_CLI_SENTRY_DSN: ${{ secrets.INLINE_CLI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/inline"
          test -x "${binary}"
          python3 -c 'import os, pathlib; dsn = os.environ["INLINE_CLI_SENTRY_DSN"]; binary = pathlib.Path("target") / os.environ["TARGET"] / "release/inline"; assert dsn and dsn.encode() in binary.read_bytes(), "Release binary is missing its Sentry DSN"'
          file "${binary}"
          case "${TARGET}" in
            aarch64-unknown-linux-gnu)
              qemu-aarch64 -L /usr/aarch64-linux-gnu "${binary}" --version
              ;;
            aarch64-unknown-linux-musl)
              qemu-aarch64 "${binary}" --version
              ;;
            x86_64-unknown-linux-*)
              "${binary}" --version
              ;;
          esac

      - name: Package Target Artifact
        if: steps.target.outputs.selected == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -czf "release-artifacts/${TARGET}.tar.gz" -C "target/${TARGET}/release" inline

      - name: Upload Target Artifact
        if: steps.target.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inline-cli-${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos:
    needs: validate
    runs-on: macos-26
    # The release script allows notarytool to wait up to 60 minutes after the
    # Rust build, so the job needs headroom for compilation and packaging.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin

    steps:
      - name: Select Target
        id: target
        env:
          TARGETS_OVERRIDE: ${{ github.event.inputs.targets }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          selected=false
          if [[ -z "${TARGETS_OVERRIDE}" ]]; then
            selected=true
          else
            IFS=',' read -ra requested <<< "${TARGETS_OVERRIDE}"
            for raw in "${requested[@]}"; do
              target="$(echo "${raw}" | xargs)"
              if [[ "${target}" == "${TARGET}" ]]; then
                selected=true
                break
              fi
            done
          fi
          echo "selected=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${TARGET}: ${selected}"

      - name: Checkout
        if: steps.target.outputs.selected == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Bun
        if: steps.target.outputs.selected == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Setup Rust
        if: steps.target.outputs.selected == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        if: steps.target.outputs.selected == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust builds
        if: steps.target.outputs.selected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install macOS Toolchain
        if: steps.target.outputs.selected == 'true'
        run: rustup target add "${{ matrix.target }}"

      - name: Import macOS signing certificate
        if: steps.target.outputs.selected == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/inline-cli-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import certificate.p12 -k "$keychain_path" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" "$keychain_path"
          echo "MACOS_CI_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build Target
        if: steps.target.outputs.selected == 'true'
        env:
          INLINE_CLI_TARGETS: ${{ matrix.target }}
          INLINE_CLI_SENTRY_DSN: ${{ secrets.INLINE_CLI_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          INLINE_SKIP_NOTARIZE: ${{ github.event.inputs.skip_notarize }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$MACOS_CI_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACOS_CI_KEYCHAIN_PATH"
          test -n "${INLINE_CLI_SENTRY_DSN}" || { echo "Missing INLINE_CLI_SENTRY_DSN release configuration" >&2; exit 1; }
          bun run scripts/release-cli.ts build

      - name: Validate Signed Target Binary
        if: steps.target.outputs.selected == 'true'
        env:
          TARGET: ${{ matrix.target }}
          INLINE_CLI_SENTRY_DSN: ${{ secrets.INLINE_CLI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/inline"
          test -x "${binary}"
          python3 -c 'import os, pathlib; dsn = os.environ["INLINE_CLI_SENTRY_DSN"]; binary = pathlib.Path("target") / os.environ["TARGET"] / "release/inline"; assert dsn and dsn.encode() in binary.read_bytes(), "Release binary is missing its Sentry DSN"'
          file "${binary}"
          codesign --verify --strict --verbose=2 "${binary}"
          case "${TARGET}" in
            aarch64-apple-darwin)
              "${binary}" --version
              ;;
          esac

      - name: Package Target Artifact
        if: steps.target.outputs.selected == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -czf "release-artifacts/${TARGET}.tar.gz" -C "target/${TARGET}/release" inline

      - name: Upload Target Artifact
        if: steps.target.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inline-cli-${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - preflight
      - validate
      - build-linux
      - build-macos
    if: ${{ always() && github.event.inputs.build_only != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Read Release Channel
        id: release
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read CLI workspace version." >&2
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Download Target Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: inline-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Restore Target Artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for archive in release-artifacts/*.tar.gz; do
            target="$(basename "${archive}" .tar.gz)"
            mkdir -p "target/${target}/release"
            tar -xzf "${archive}" -C "target/${target}/release"
            count=$((count + 1))
          done
          if [[ "${count}" -eq 0 ]]; then
            echo "No target artifacts were downloaded." >&2
            exit 1
          fi

      - name: Clone Homebrew Tap
        if: ${{ steps.release.outputs.prerelease == 'false' && (github.event.inputs.targets == '' || contains(github.event.inputs.targets, 'apple-darwin')) }}
        env:
          INLINE_HOMEBREW_TAP_TOKEN: ${{ secrets.INLINE_HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${INLINE_HOMEBREW_TAP_TOKEN}@github.com/inline-chat/homebrew-inline.git" homebrew-inline

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish CLI Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INLINE_HOMEBREW_TAP_PATH: ${{ github.workspace }}/homebrew-inline
          PUBLIC_RELEASES_R2_ACCESS_KEY_ID: ${{ secrets.PUBLIC_RELEASES_R2_ACCESS_KEY_ID }}
          PUBLIC_RELEASES_R2_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_RELEASES_R2_SECRET_ACCESS_KEY }}
          PUBLIC_RELEASES_R2_BUCKET: ${{ secrets.PUBLIC_RELEASES_R2_BUCKET }}
          PUBLIC_RELEASES_R2_ENDPOINT: ${{ secrets.PUBLIC_RELEASES_R2_ENDPOINT }}
          PUBLIC_RELEASES_R2_PUBLIC_BASE_URL: ${{ secrets.PUBLIC_RELEASES_R2_PUBLIC_BASE_URL }}
          INLINE_CLI_RELEASE_RESUME: "1"
          TARGETS_OVERRIDE: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGETS_OVERRIDE}" ]]; then
            export INLINE_CLI_TARGETS="${TARGETS_OVERRIDE}"
          fi
          public_target="$(git rev-parse HEAD)"
          if [[ ! "${public_target}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid public release target: ${public_target}" >&2
            exit 1
          fi
          export INLINE_CLI_GITHUB_TARGET="${public_target}"
          bun run scripts/release-cli.ts publish
