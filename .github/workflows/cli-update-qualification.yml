name: CLI Update Qualification

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cli/**'
      - 'crates/**'
      - 'vendor/**'
      - 'proto/**'
      - 'apple/InlineMacUI/**'
      - 'scripts/release-cli*'
      - 'scripts/cli-release-*'
      - 'scripts/ci/assert-release-commit.mjs'
      - 'scripts/ci/release-tag.test.ts'
      - 'scripts/ci/cli-release-version*'
      - 'scripts/ci/test-cli-update-*'
      - 'scripts/ci/test-cli-installer.py'
      - '.github/workflows/cli-release.yml'
      - '.github/workflows/cli-update-qualification.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cli/**'
      - 'crates/**'
      - 'vendor/**'
      - 'proto/**'
      - 'apple/InlineMacUI/**'
      - 'scripts/release-cli*'
      - 'scripts/cli-release-*'
      - 'scripts/ci/assert-release-commit.mjs'
      - 'scripts/ci/release-tag.test.ts'
      - 'scripts/ci/cli-release-version*'
      - 'scripts/ci/test-cli-update-*'
      - 'scripts/ci/test-cli-installer.py'
      - '.github/workflows/cli-release.yml'
      - '.github/workflows/cli-update-qualification.yml'
  workflow_dispatch:
    inputs:
      published_upgrade_smoke:
        description: Exercise released stable/alpha upgrades and feed recovery in disposable installs
        type: boolean
        default: false
      maintenance_artifact:
        description: Retain a macOS CLI for operator-triggered idle supervisor maintenance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Update, drain, rollback and telemetry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/ci/ensure-public-workspaces.sh
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      - name: Test updater and both bridge generations
        run: cargo test --locked -j 2 -p inline-cli -p inline-agent-bridge
      - name: Verify signing, publication and installer contracts
        run: |
          bun --no-env-file test scripts/release-cli.test.ts scripts/cli-release-signing.test.ts scripts/ci/cli-release-version.test.ts scripts/ci/release-tag.test.ts
          python3 scripts/ci/test-cli-installer.py
          python3 scripts/ci/test-cli-update-protocol.py
      - name: Exercise released stable and alpha upgrades
        if: github.event_name == 'workflow_dispatch' && inputs.published_upgrade_smoke
        timeout-minutes: 15
        run: python3 scripts/ci/test-cli-update-published.py
      - name: Compile and test Mac installer/update protocol
        if: runner.os == 'macOS'
        run: bash scripts/ci/test-cli-update-swift.sh
      - name: Prove Sentry ingestion from the real SDK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          INLINE_CLI_SENTRY_DSN: ${{ secrets.CLI_UPDATE_QUALIFICATION_SENTRY_DSN }}
        run: |
          test -n "$INLINE_CLI_SENTRY_DSN"
          export INLINE_DATA_DIR="$RUNNER_TEMP/inline-updater-telemetry"
          mkdir -p "$INLINE_DATA_DIR"
          cargo test --locked -p inline-cli --bin inline telemetry::tests::live_update_outcomes -- --ignored --exact --nocapture
      - name: Build operator maintenance CLI
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.maintenance_artifact
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --locked -j 2 -p inline-cli --bin inline
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.maintenance_artifact
        with:
          name: inline-macos-maintenance-cli
          path: target/debug/inline
          retention-days: 3
