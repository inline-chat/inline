name: Hermes stable compatibility

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: npm latest / Hermes ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [latest, main]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install current official Hermes host
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_REF: ${{ matrix.host }}
        run: bash scripts/ci/install-hermes-host.sh "$RUNNER_TEMP/hermes-host" "$HERMES_REF"
      - name: Test npm latest through real Hermes (offline transport)
        env:
          HERMES_BIN: ${{ steps.host.outputs.hermes-bin }}
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: node scripts/ci/check-hermes-admission.mjs --latest "$HERMES_BIN" "$HERMES_PYTHON"
