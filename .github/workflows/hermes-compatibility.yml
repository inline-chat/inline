name: Hermes stable compatibility

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: npm latest / Hermes ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [latest, main]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install current official Hermes host
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_REF: ${{ matrix.host }}
        run: bash scripts/ci/install-hermes-host.sh "$RUNNER_TEMP/hermes-host" "$HERMES_REF"
      - name: Test npm latest through real Hermes (offline transport)
        env:
          HERMES_BIN: ${{ steps.host.outputs.hermes-bin }}
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: node scripts/ci/check-hermes-admission.mjs --latest "$HERMES_BIN" "$HERMES_PYTHON"
      - name: Run an inbound turn through the production Hermes gateway (npm latest)
        env:
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: |
          pack_dir="$RUNNER_TEMP/npm-latest"
          mkdir -p "$pack_dir"
          npm pack @inline-chat/hermes-agent-adapter@latest --pack-destination "$pack_dir"
          tar -xzf "$pack_dir"/*.tgz -C "$pack_dir"
          "$HERMES_PYTHON" scripts/ci/hermes-gateway-e2e.py "$pack_dir/package/plugin/inline"

  # Moved from CI: the unreleased adapter candidate against moving Hermes hosts.
  # CI pins Hermes so upstream releases cannot turn the deploy gate red.
  candidate:
    name: source candidate / Hermes ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host: [latest, main]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - name: Build and pack exact candidate bytes
        run: |
          bun run build:integrations
          node scripts/ci/pack-public-packages.mjs "$RUNNER_TEMP/inline-packages"
      - name: Install official Hermes source
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_REF: ${{ matrix.host }}
        run: bash scripts/ci/install-hermes-host.sh "$RUNNER_TEMP/hermes-host" "$HERMES_REF"
      - name: Validate packed adapter and message flow through real Hermes
        env:
          HERMES_BIN: ${{ steps.host.outputs.hermes-bin }}
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: node scripts/ci/check-hermes-admission.mjs "$RUNNER_TEMP/inline-packages" "$HERMES_BIN" "$HERMES_PYTHON"
      - name: Validate native catalog source installation
        env:
          HERMES_BIN: ${{ steps.host.outputs.hermes-bin }}
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: node scripts/ci/check-hermes-source.mjs plugins/hermes-agent/plugin/inline "$HERMES_BIN" "$HERMES_PYTHON"
      - name: Run an inbound turn through the production Hermes gateway
        env:
          HERMES_PYTHON: ${{ steps.host.outputs.python-bin }}
        run: |
          "$HERMES_PYTHON" scripts/ci/hermes-gateway-e2e.py plugins/hermes-agent/plugin/inline
