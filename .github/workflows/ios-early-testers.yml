name: iOS Early Testers credential preflight
on:
  push:
    branches: [codex/ios-early-testers]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check Apple credentials and internal group without mutations
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: node scripts/ci/ios-early-testers.mjs --preflight
