name: Deploy Server

# Manual publication may select a branch in this repository. Production releases
# remain main-only; no arbitrary ref input or push trigger. Restrict production
# environments to main as an independent deployment fence.
#
# A normal release owns both origins: qualify both images, migrate once, then
# release and smoke-test the Nuremberg fallback before Fly, so a ready origin
# exists throughout. Every step is safe to repeat: after a partial failure,
# "Re-run failed jobs" resumes where it stopped. `origins` releases one origin
# alone when that is deliberately needed. CI uses public GHCR images and
# Coolify's API; no host SSH key or registry pull credential is needed.
#
# Soft gate: a release waits for the server-relevant CI jobs of its commit
# (require_green, beside qualification, before any production job). `skip_gate` with a `skip_reason`
# always bypasses it for incidents. `rollback_to_plan` redeploys the pre-release
# images that the latest release plan recorded, without the gate, qualification
# or migrations; see server/docs/fly-deployment.md.
on:
  workflow_dispatch:
    inputs:
      origins:
        description: Origins to release (both keeps the fallback in step with Fly)
        type: choice
        default: both
        options: [both, fly, nuremberg]
      publish_only:
        description: Qualify and publish this branch's images for rehearsal; do not deploy
        type: boolean
        default: false
      bootstrap:
        description: Create the first API-only Machine, then await protected cutover approval before enabling workers
        type: boolean
        default: false
      skip_gate:
        description: "Incident bypass: do not wait for the server-relevant CI jobs of this commit (needs skip_reason; route-family probes become advisory)"
        type: boolean
        default: false
      skip_reason:
        description: Why the green-CI gate is skipped (required with skip_gate; recorded in the run summary)
        type: string
        default: ""
      rollback_to_plan:
        description: "Fast rollback: redeploy the pre-release images recorded by the plan of the latest release that reached an origin. Skips the gate, qualification and migrations; the API accepts a database ahead of it. Only safe after additive migrations."
        type: boolean
        default: false
      rollback_plan_run:
        description: "With rollback_to_plan: the release run id whose plan to use (default: the most recent release plan)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: server-deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual publication or main release
    runs-on: ubuntu-latest
    steps:
      - env:
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          ORIGINS: ${{ inputs.origins }}
          ROLLBACK: ${{ inputs.rollback_to_plan }}
          PLAN_RUN: ${{ inputs.rollback_plan_run }}
          SKIP_GATE: ${{ inputs.skip_gate }}
          SKIP_REASON: ${{ inputs.skip_reason }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = inline-chat/inline
          test "$GITHUB_REF_TYPE" = branch
          [[ "$GITHUB_REF" == refs/heads/* ]] || exit 1
          case "$PUBLISH_ONLY:$BOOTSTRAP" in
            true:false) ;;
            false:false|false:true) test "$GITHUB_REF" = refs/heads/main ;;
            *) exit 1 ;;
          esac
          case "$ORIGINS" in
            both|nuremberg) test "$BOOTSTRAP" = false ;;
            fly) ;;
            *) exit 1 ;;
          esac
          case "$ROLLBACK" in
            true)
              if [[ "$GITHUB_REF" != refs/heads/main || "$PUBLISH_ONLY" != false || "$BOOTSTRAP" != false ]]; then
                echo 'rollback_to_plan runs from main without publish_only or bootstrap' >&2
                exit 1
              fi
              [[ -z "$PLAN_RUN" || "$PLAN_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'rollback_plan_run must be a run id' >&2; exit 1; } ;;
            false) test -z "$PLAN_RUN" || { echo 'rollback_plan_run requires rollback_to_plan' >&2; exit 1; } ;;
            *) exit 1 ;;
          esac
          if [[ "$SKIP_GATE" == true && -z "${SKIP_REASON//[[:space:]]/}" ]]; then
            echo 'skip_gate requires a skip_reason' >&2
            exit 1
          fi
          if [[ "$SKIP_GATE" != true && -n "${SKIP_REASON//[[:space:]]/}" ]]; then
            echo 'skip_reason is only valid with skip_gate' >&2
            exit 1
          fi

  require_green:
    name: Require green CI and Server Tests for this commit
    needs: validate
    # Runs beside qualification, so a green commit adds no latency; preflight,
    # the first production job, waits for it. It gates only on the
    # server-relevant jobs listed in scripts/ci/require-green.ts, and waits for
    # running ones at most 15 minutes (about qualify's duration), so a waiting
    # gate holds the run-level lock no longer than qualification already does.
    if: ${{ !inputs.publish_only && !inputs.rollback_to_plan }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record the incident bypass
        if: ${{ inputs.skip_gate }}
        env:
          SKIP_REASON: ${{ inputs.skip_reason }}
        run: |
          reason=$(printf '%s' "$SKIP_REASON" | tr '\000-\037\177' ' ' | tr '`<>' '\047\047\047' | tr -s ' ' | cut -c1-300)
          printf '#### Deploy gate: skipped by %s\n\n> %s\n\nServer-relevant CI was not checked for `%s`.\n\n' \
            "$GITHUB_ACTOR" "$reason" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Deploy gate skipped by $GITHUB_ACTOR::${reason//%/%25}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ !inputs.skip_gate }}
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ !inputs.skip_gate }}
        with:
          bun-version: "1.4.4"
      - name: Wait for the server-relevant CI jobs of the release commit
        if: ${{ !inputs.skip_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun --no-env-file scripts/ci/require-green.ts --wait

  qualify:
    name: Qualify and publish the exact release image
    needs: validate
    if: ${{ !inputs.rollback_to_plan }}
    permissions:
      contents: read
      packages: write # Only the called, manual publisher receives this permission.
    uses: ./.github/workflows/server-test.yml
    with:
      publish_image: true
      publish_only: ${{ inputs.publish_only }}

  prepared:
    name: Report the qualified image for rehearsal or bootstrap
    needs: qualify
    if: ${{ inputs.publish_only }}
    runs-on: ubuntu-latest
    env:
      RUNTIME_IMAGE: ${{ needs.qualify.outputs.runtime_image }}
      STANDBY_IMAGE: ${{ needs.qualify.outputs.standby_image }}
    steps:
      - name: Record the exact image without accessing production
        run: |
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$STANDBY_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          printf 'Prepared `%s` at `%s` for rehearsal or initial bootstrap. Production preflight, migrations, and deployment were skipped.\n' \
            "$GITHUB_SHA" "$RUNTIME_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'ARM64 Coolify image: `%s`. No Hetzner deployment was performed.\n' "$STANDBY_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  preflight:
    name: Check both origins and save the release plan before DDL
    needs: [qualify, require_green]
    # skip_gate passes even if the gate job itself could not run (checkout,
    # GitHub API). A rollback skips qualify and therefore preflight and migrate.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.publish_only && needs.qualify.result == 'success' && (needs.require_green.result == 'success' || inputs.skip_gate) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      ORIGINS: ${{ inputs.origins }}
      RELEASE_SHA: ${{ github.sha }}
      RUNTIME_IMAGE: ${{ needs.qualify.outputs.runtime_image }}
      STANDBY_IMAGE: ${{ needs.qualify.outputs.standby_image }}
      FLY_ORIGIN_IP: ${{ vars.FLY_ORIGIN_IP }}
      NBG_ORIGIN_IP: ${{ secrets.NBG_ORIGIN_IP }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.NBG_COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_NBG_TOKEN }}
      SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
      SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
    outputs:
      baseline: ${{ steps.baseline.outputs.baseline }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.107"
      - name: Check required configuration and anonymous image access
        env:
          MIGRATION_URL: ${{ secrets.PRODUCTION_DATABASE_MIGRATION_URL }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" && test -n "$MIGRATION_URL"
          if [[ "$BOOTSTRAP" != true ]]; then
            test -n "$SMOKE_BOT_TOKEN" && test -n "$SMOKE_CHAT_ID" && test -n "$FLY_ORIGIN_IP"
          fi
          if [[ "$ORIGINS" != fly ]]; then
            test -n "$NBG_ORIGIN_IP" && test -n "$COOLIFY_URL" && test -n "$COOLIFY_APP_UUID" && test -n "$COOLIFY_TOKEN"
          fi
          mkdir -p "$RUNNER_TEMP/anonymous-registry"
          for image in "$RUNTIME_IMAGE" "$STANDBY_IMAGE"; do
            [[ "$image" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
            DOCKER_CONFIG="$RUNNER_TEMP/anonymous-registry" docker manifest inspect "$image" > /dev/null
          done
      - name: Restore an existing release plan without replacing its original baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-plan"
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "server-release-plan" and .expired == false)] | max_by(.id) | .name // empty')
          if [[ -n "$name" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/release-plan"
          fi
      - name: Validate public Machine compatibility and service readiness
        run: |
          set -euo pipefail
          flyctl machine list --config server/fly.toml --json > "$RUNNER_TEMP/machines.json"
          filter=scripts/ci/fly-release-machines.jq
          if [[ "$BOOTSTRAP" = true ]]; then filter=scripts/ci/fly-release-machines-bootstrap.jq; fi
          jq -ce -f "$filter" "$RUNNER_TEMP/machines.json" > "$RUNNER_TEMP/fly-baseline.json"
      - name: Check Coolify and the selected smoke account without sending messages
        env:
          NBG_BASELINE_FILE: ${{ runner.temp }}/nbg-baseline.json
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP" != true ]]; then
            revision=$(jq -er '.revision' "$RUNNER_TEMP/fly-baseline.json")
            bun --no-env-file scripts/ci/release-smoke.ts --preflight --origin fly --ip "$FLY_ORIGIN_IP" --revision "$revision"
          fi
          if [[ "$ORIGINS" != fly ]]; then
            bun --no-env-file scripts/ci/nbg-release.ts --preflight
            bun --no-env-file scripts/ci/release-smoke.ts --preflight --origin nuremberg --ip "$NBG_ORIGIN_IP"
          fi
      - name: Verify the dedicated cross-origin fixture without sending messages
        if: ${{ !inputs.bootstrap && inputs.origins == 'both' }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          docker run --rm --entrypoint bun \
            -e SMOKE_BOT_TOKEN -e SMOKE_CHAT_ID \
            "$RUNTIME_IMAGE" --no-env-file server/dist/realtime-cross-origin-smoke.js \
            --fly-ip "$FLY_ORIGIN_IP" --nbg-ip "$NBG_ORIGIN_IP" --preflight
      - name: Save the qualified image identities and original restore targets
        id: baseline
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release-plan/release.json"
          if [[ -f "$plan" ]]; then
            jq -e --arg sha "$GITHUB_SHA" --arg runtime "$RUNTIME_IMAGE" --arg standby "$STANDBY_IMAGE" \
              --arg origins "$ORIGINS" --argjson bootstrap "$BOOTSTRAP" \
              '.schema == 1 and .sha == $sha and .runtime_image == $runtime and .standby_image == $standby and .origins == $origins and .bootstrap == $bootstrap' "$plan" > /dev/null
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
              # No retained plan: no earlier attempt passed this job, so none can have
              # migrated or replaced an origin (those jobs need it). Confirm that from
              # the earlier attempts before recording the baseline now, e.g. on a
              # rerun after the deploy gate failed.
              reached=0
              for ((attempt = 1; attempt < GITHUB_RUN_ATTEMPT; attempt++)); do
                count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
                  --jq '[.jobs[] | select((.name == "Migrate and verify with the qualified image" or .name == "Release and smoke-test the Nuremberg fallback" or .name == "Replace the public Machines and verify readiness") and .conclusion != "skipped")] | length')
                reached=$((reached + count))
              done
              if [[ "$reached" != 0 ]]; then
                echo 'An earlier attempt reached migrations or an origin, but its release plan is unavailable; start a new dispatch rather than recapturing a changed baseline.' >&2
                exit 1
              fi
            fi
            nbg=null
            if [[ "$ORIGINS" != fly ]]; then nbg=$(cat "$RUNNER_TEMP/nbg-baseline.json"); fi
            migration=$(jq -er '.entries[-1].tag' server/drizzle/meta/_journal.json)
            jq -n --arg sha "$GITHUB_SHA" --arg runtime "$RUNTIME_IMAGE" --arg standby "$STANDBY_IMAGE" \
              --arg migration "$migration" --arg origins "$ORIGINS" --argjson bootstrap "$BOOTSTRAP" \
              --slurpfile fly "$RUNNER_TEMP/fly-baseline.json" --argjson nuremberg "$nbg" \
              '{schema:1,sha:$sha,runtime_image:$runtime,standby_image:$standby,migration_head:$migration,origins:$origins,bootstrap:$bootstrap,fly:$fly[0],nuremberg:$nuremberg}' > "$plan"
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi
          baseline=$(jq -ce '.fly' "$plan")
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
      - name: Retain the plan before any database or origin change
        if: steps.baseline.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-release-plan
          path: ${{ runner.temp }}/release-plan/release.json
          retention-days: 90
          if-no-files-found: error

  migrate:
    name: Migrate and verify with the qualified image
    needs: [qualify, preflight]
    # Explicit, so a failed gate job bypassed with skip_gate cannot skip it.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.publish_only && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RUNTIME_IMAGE: ${{ needs.qualify.outputs.runtime_image }}
    steps:
      - name: Pull and verify the qualified image revision
        run: |
          set -euo pipefail
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          docker pull "$RUNTIME_IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RUNTIME_IMAGE")" = "$GITHUB_SHA"
      - name: Apply and verify the migration ledger
        env:
          # DDL credentials belong only to this step, never to the API Machines.
          DATABASE_DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_MIGRATION_URL }}
          DATABASE_CONNECTION_MODE: direct
        run: |
          test -n "$DATABASE_DIRECT_URL"
          docker run --rm -e DATABASE_DIRECT_URL -e DATABASE_CONNECTION_MODE \
            "$RUNTIME_IMAGE" bun server/dist/migrate.js
          docker run --rm -e DATABASE_DIRECT_URL -e DATABASE_CONNECTION_MODE \
            "$RUNTIME_IMAGE" bun server/dist/verify-migrations.js

  nuremberg:
    name: Release and smoke-test the Nuremberg fallback
    needs: [qualify, preflight, migrate]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.publish_only && inputs.origins != 'fly' && needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.release.outputs.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      STANDBY_IMAGE: ${{ needs.qualify.outputs.standby_image }}
      NBG_ORIGIN_IP: ${{ secrets.NBG_ORIGIN_IP }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_NBG_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.NBG_COOLIFY_APP_UUID }}
      SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
      SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
      INLINE_SMOKE_PROBES: ${{ inputs.skip_gate && 'advisory' || 'required' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Restore the latest recorded Coolify deployment for this run
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nbg-state"
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("nbg-release-state-")) and .expired == false)] | max_by(.id) | .name // empty')
          if [[ -n "$name" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/nbg-state"
          fi
      - name: Pin, deploy and verify the exact ARM64 image through Coolify
        id: release
        env:
          RELEASE_PLAN: ${{ runner.temp }}/release-plan/release.json
          NBG_STATE_FILE: ${{ runner.temp }}/nbg-state/receipt.json
          # Optional route-family probes; each absent secret skips its probe with a notice.
          INLINE_SMOKE_USER_TOKEN: ${{ secrets.INLINE_SMOKE_USER_TOKEN }}
          INLINE_SMOKE_MCP_SECRET: ${{ secrets.INLINE_SMOKE_MCP_SECRET }}
          INLINE_SMOKE_OAUTH_TOKEN: ${{ secrets.INLINE_SMOKE_OAUTH_TOKEN }}
        run: bun --no-env-file scripts/ci/nbg-release.ts
      - name: Probe the V3 protocol on Nuremberg directly
        # Advisory until a production run confirms the probe; then remove this line.
        continue-on-error: true
        timeout-minutes: 5
        env:
          ORIGIN_IP: ${{ secrets.NBG_ORIGIN_IP }}
          INLINE_SMOKE_V3_CREDENTIALS: ${{ secrets.INLINE_SMOKE_V3_CREDENTIALS }}
        run: |
          set -euo pipefail
          # Third-party packages never see the job's deployment credentials.
          clean=(env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP")
          "${clean[@]}" bun install --frozen-lockfile --ignore-scripts
          "${clean[@]}" bun run --cwd packages/protocol build
          # The credential travels on stdin, never in an argv or the probe's environment.
          printf '%s' "$INLINE_SMOKE_V3_CREDENTIALS" | "${clean[@]}" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            INLINE_SMOKE_PROBES="$INLINE_SMOKE_PROBES" bun --no-env-file scripts/ci/release-smoke-v3.ts \
            --origin nuremberg --ip "$ORIGIN_IP" --credentials-stdin
      - name: Verify canonical routing still reaches the unchanged Fly release
        if: inputs.origins == 'nuremberg'
        run: |
          set -euo pipefail
          revision=$(jq -er '.fly.revision' "$RUNNER_TEMP/release-plan/release.json")
          bun --no-env-file scripts/ci/release-smoke.ts --preflight --origin canonical --revision "$revision"
      - name: Retain the deployment receipt even when verification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nbg-release-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nbg-state/receipt.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

  deploy:
    name: Replace the public Machines and verify readiness
    needs: [qualify, preflight, migrate, nuremberg]
    # Fly waits for a verified fallback, or runs alone when only Fly was chosen.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.publish_only && inputs.origins != 'nuremberg' && needs.migrate.result == 'success' && (needs.nuremberg.result == 'success' || needs.nuremberg.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      bootstrap_baseline: ${{ steps.verify.outputs.bootstrap_baseline }}
      outcome: ${{ steps.replace.outputs.outcome }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RUNTIME_IMAGE: ${{ needs.qualify.outputs.runtime_image }}
      BASELINE: ${{ needs.preflight.outputs.baseline }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.107"
      - name: Revalidate the recorded baseline and deploy the same digest
        id: replace
        run: |
          test -n "$FLY_API_TOKEN"
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          flyctl machine list --config server/fly.toml --json > "$RUNNER_TEMP/machines-before.json"
          filter=scripts/ci/fly-release-machines.jq
          if [[ "$BOOTSTRAP" = true ]]; then filter=scripts/ci/fly-release-machines-bootstrap.jq; fi
          current=$(jq -ce -f "$filter" "$RUNNER_TEMP/machines-before.json")
          # A re-run after Fly already took this digest has nothing to replace.
          if [[ "$BOOTSTRAP" != true ]] &&
            jq -e --argjson baseline "$BASELINE" --arg digest "${RUNTIME_IMAGE##*@}" --arg sha "$GITHUB_SHA" \
              '.count == $baseline.count and .digest == $digest and .revision == $sha' <<< "$current" > /dev/null; then
            echo "Fly already serves $GITHUB_SHA; verifying only."
            echo "outcome=already-current" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          echo "outcome=published" >> "${GITHUB_OUTPUT:-/dev/null}"
          test "$current" = "$BASELINE"
          MACHINE_IDS=$(jq -er '.ids' <<< "$BASELINE")
          if [[ "$BOOTSTRAP" = true ]]; then
            API_ID=$(jq -r '.api.id // empty' <<< "$BASELINE")
            if [[ -n "$API_ID" ]]; then
              flyctl deploy --config server/fly.toml --image "$RUNTIME_IMAGE" \
                --only-machines "$API_ID" --strategy bluegreen --ha=false --signal SIGTERM --wait-timeout 5m --yes \
                --env INLINE_PROCESS_ROLE=api
            else
              exclusions=()
              if [[ -n "$MACHINE_IDS" ]]; then exclusions=(--exclude-machines "$MACHINE_IDS"); fi
              flyctl deploy --config server/fly.toml --image "$RUNTIME_IMAGE" \
                "${exclusions[@]}" --strategy immediate --ha=false --wait-timeout 5m --yes \
                --vm-cpu-kind shared --vm-cpus 6 --vm-memory 1536 --env INLINE_PROCESS_ROLE=api
            fi
          else
            flyctl deploy --config server/fly.toml --image "$RUNTIME_IMAGE" \
              --only-machines "$MACHINE_IDS" --strategy bluegreen --ha=false \
              --signal SIGTERM --wait-timeout 5m --yes
          fi
      - name: Verify baseline count, image revision, and service health
        id: verify
        run: |
          BASELINE_COUNT=1
          if [[ "$BOOTSTRAP" != true ]]; then BASELINE_COUNT=$(jq -er '.count' <<< "$BASELINE"); fi
          bash scripts/ci/fly-release-wait.sh "$RUNNER_TEMP/machines-after.json" \
            "$BASELINE_COUNT" "${RUNTIME_IMAGE##*@}" "$GITHUB_SHA"
          current=$(jq -ce -f scripts/ci/fly-release-machines.jq "$RUNNER_TEMP/machines-after.json")
          if [[ "$BOOTSTRAP" = true ]]; then
            after=$(jq -ce -f scripts/ci/fly-release-machines-bootstrap.jq "$RUNNER_TEMP/machines-after.json")
            test "$(jq -c 'del(.api)' <<< "$after")" = "$(jq -c 'del(.api)' <<< "$BASELINE")"
            snapshot=$(jq -ce '.api' <<< "$after")
            printf 'bootstrap_baseline=%s\n' "$snapshot" >> "$GITHUB_OUTPUT"
          fi
          jq -e --argjson count "$BASELINE_COUNT" --arg digest "${RUNTIME_IMAGE##*@}" --arg sha "$GITHUB_SHA" \
            '.count == $count and .digest == $digest and .revision == $sha' <<< "$current" > /dev/null
          printf 'Released `%s` at `%s`; %s public Machine(s) passed Fly service checks.\n' \
            "$GITHUB_SHA" "$RUNTIME_IMAGE" "$BASELINE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BOOTSTRAP" = true ]]; then
            printf 'API-only bootstrap is ready. Qualify authenticated paths, transfer routing, and stop the old all-role API before approving production-cutover.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ !inputs.bootstrap }}
        with:
          bun-version: "1.4.4"
      - name: Smoke-test the canonical route
        if: ${{ !inputs.bootstrap }}
        env:
          FLY_ORIGIN_IP: ${{ vars.FLY_ORIGIN_IP }}
          SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
          SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
          # Route-family probes run against the pinned Fly origin only.
          INLINE_SMOKE_USER_TOKEN: ${{ secrets.INLINE_SMOKE_USER_TOKEN }}
          INLINE_SMOKE_MCP_SECRET: ${{ secrets.INLINE_SMOKE_MCP_SECRET }}
          INLINE_SMOKE_OAUTH_TOKEN: ${{ secrets.INLINE_SMOKE_OAUTH_TOKEN }}
          INLINE_SMOKE_PROBES: ${{ inputs.skip_gate && 'advisory' || 'required' }}
        run: |
          set -euo pipefail
          bun --no-env-file scripts/ci/release-smoke.ts --origin fly --revision "$GITHUB_SHA" --ip "$FLY_ORIGIN_IP"
          bun --no-env-file scripts/ci/release-smoke.ts --origin canonical --revision "$GITHUB_SHA"
      - name: Probe the V3 protocol on Fly directly
        if: ${{ !inputs.bootstrap }}
        # Advisory until a production run confirms the probe; then remove this line.
        continue-on-error: true
        timeout-minutes: 5
        env:
          ORIGIN_IP: ${{ vars.FLY_ORIGIN_IP }}
          INLINE_SMOKE_PROBES: ${{ inputs.skip_gate && 'advisory' || 'required' }}
          INLINE_SMOKE_V3_CREDENTIALS: ${{ secrets.INLINE_SMOKE_V3_CREDENTIALS }}
        run: |
          set -euo pipefail
          # Third-party packages never see the job's deployment credentials.
          clean=(env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP")
          "${clean[@]}" bun install --frozen-lockfile --ignore-scripts
          "${clean[@]}" bun run --cwd packages/protocol build
          # The credential travels on stdin, never in an argv or the probe's environment.
          printf '%s' "$INLINE_SMOKE_V3_CREDENTIALS" | "${clean[@]}" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            INLINE_SMOKE_PROBES="$INLINE_SMOKE_PROBES" bun --no-env-file scripts/ci/release-smoke-v3.ts \
            --origin fly --ip "$ORIGIN_IP" --credentials-stdin
      - name: Verify large live messages across both origins
        if: ${{ !inputs.bootstrap && inputs.origins == 'both' }}
        env:
          FLY_ORIGIN_IP: ${{ vars.FLY_ORIGIN_IP }}
          NBG_ORIGIN_IP: ${{ secrets.NBG_ORIGIN_IP }}
          SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
          SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          docker run --rm --entrypoint bun \
            -e SMOKE_BOT_TOKEN -e SMOKE_CHAT_ID \
            "$RUNTIME_IMAGE" --no-env-file server/dist/realtime-cross-origin-smoke.js \
            --revision "$GITHUB_SHA" --fly-ip "$FLY_ORIGIN_IP" --nbg-ip "$NBG_ORIGIN_IP" --confirm-test-writes

  activate:
    name: Enable workers on the same qualified bootstrap image
    needs: [qualify, deploy]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.publish_only && inputs.bootstrap && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required-reviewer protection must be configured before bootstrap dispatch.
    # Approval means routing is verified and the old all-role API is stopped.
    environment: production-cutover
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RUNTIME_IMAGE: ${{ needs.qualify.outputs.runtime_image }}
      BOOTSTRAP_BASELINE: ${{ needs.deploy.outputs.bootstrap_baseline }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.107"
      - name: Recheck the exact API-only Machine
        run: |
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          flyctl machine list --config server/fly.toml --json > "$RUNNER_TEMP/before-activation.json"
          current=$(jq -ce -f scripts/ci/fly-release-machines.jq "$RUNNER_TEMP/before-activation.json")
          jq -e --argjson expected "$BOOTSTRAP_BASELINE" --arg digest "${RUNTIME_IMAGE##*@}" --arg sha "$GITHUB_SHA" \
            '.count == 1 and .ids == $expected.id and .digest == $digest and .revision == $sha' <<< "$current" > /dev/null
          snapshot=$(jq -c '[.[] | select(.state != "destroyed" and (.config.services // [] | length) > 0)] | .[0] |
            {id, version, digest: .image_ref.digest, revision: .image_ref.labels["org.opencontainers.image.revision"]}' "$RUNNER_TEMP/before-activation.json")
          test "$snapshot" = "$BOOTSTRAP_BASELINE"
          jq -e '[.[] | select(.state != "destroyed" and (.config.services // [] | length) > 0)] | all(.[];
            .config.env.INLINE_PROCESS_ROLE == "api" and .config.env.INLINE_INGRESS_HOST == "api.inline.chat")' \
            "$RUNNER_TEMP/before-activation.json" > /dev/null
      - name: Verify the predecessor is durably stopped
        env:
          FLY_API_TOKEN: ${{ secrets.LEGACY_FLY_READ_TOKEN }}
          PREDECESSOR_FLY_APP: ${{ vars.PREDECESSOR_FLY_APP }}
          PREDECESSOR_MACHINE_ID: ${{ vars.PREDECESSOR_MACHINE_ID }}
        run: |
          test -n "$FLY_API_TOKEN"
          test "$PREDECESSOR_FLY_APP" = inline-fra-standby
          test -n "$PREDECESSOR_MACHINE_ID"
          flyctl machine list --app "$PREDECESSOR_FLY_APP" --json > "$RUNNER_TEMP/predecessor.json"
          jq -e --arg predecessor "$PREDECESSOR_MACHINE_ID" -f scripts/ci/fly-release-machines-legacy.jq \
            "$RUNNER_TEMP/predecessor.json" > /dev/null
      - name: Activate the same qualified digest with workers
        run: |
          MACHINE_ID=$(jq -er '.id' <<< "$BOOTSTRAP_BASELINE")
          flyctl deploy --config server/fly.toml --image "$RUNTIME_IMAGE" \
            --only-machines "$MACHINE_ID" --strategy bluegreen --ha=false --signal SIGTERM --wait-timeout 5m --yes
      - name: Verify the all-role Machine
        run: |
          bash scripts/ci/fly-release-wait.sh "$RUNNER_TEMP/after-activation.json" \
            1 "${RUNTIME_IMAGE##*@}" "$GITHUB_SHA"
          current=$(jq -ce -f scripts/ci/fly-release-machines.jq "$RUNNER_TEMP/after-activation.json")
          jq -e --arg digest "${RUNTIME_IMAGE##*@}" --arg sha "$GITHUB_SHA" \
            '.count == 1 and .digest == $digest and .revision == $sha' <<< "$current" > /dev/null
          jq -e '[.[] | select(.state != "destroyed" and (.config.services // [] | length) > 0)] | all(.[];
            .config.env.INLINE_PROCESS_ROLE == "all" and .config.env.INLINE_INGRESS_HOST == "api.inline.chat")' \
            "$RUNNER_TEMP/after-activation.json" > /dev/null
          printf 'Activated workers for `%s` at `%s`; one all-role public Machine passed service checks.\n' \
            "$GITHUB_SHA" "$RUNTIME_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # rollback_to_plan: Fly and Nuremberg roll back in parallel to the images the
  # latest release plan recorded before that release. No gate, qualification or
  # migration runs: the API accepts a database ahead of its packaged migration
  # head (server/src/db/migrationState.ts), and only additive migrations keep an
  # older image compatible. Re-run failed jobs resumes a partial rollback.
  rollback_plan:
    name: Select the recorded pre-release images to roll back to
    needs: validate
    if: ${{ inputs.rollback_to_plan }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      plan_run: ${{ steps.plan.outputs.plan_run }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      fly: ${{ steps.plan.outputs.fly }}
      fly_image: ${{ steps.plan.outputs.fly_image }}
      fly_revision: ${{ steps.plan.outputs.fly_revision }}
      nuremberg: ${{ steps.plan.outputs.nuremberg }}
      nbg_baseline: ${{ steps.plan.outputs.nbg_baseline }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Find the latest release plan and its baselines
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINS: ${{ inputs.origins }}
          PLAN_RUN_ID: ${{ inputs.rollback_plan_run }}
          PLAN_DIR: ${{ runner.temp }}/rollback-plan
        run: bun --no-env-file scripts/ci/rollback-plan.ts

  rollback_nuremberg:
    name: Roll the Nuremberg fallback back to its recorded image
    needs: [validate, rollback_plan]
    if: ${{ !cancelled() && inputs.rollback_to_plan && needs.rollback_plan.result == 'success' && needs.rollback_plan.outputs.nuremberg == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.rollback.outputs.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLBACK_BASELINE: ${{ needs.rollback_plan.outputs.nbg_baseline }}
      NBG_ORIGIN_IP: ${{ secrets.NBG_ORIGIN_IP }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_NBG_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.NBG_COOLIFY_APP_UUID }}
      SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
      SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Restore this run's recorded rollback deployment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nbg-state"
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("nbg-rollback-state-")) and .expired == false)] | max_by(.id) | .name // empty')
          if [[ -n "$name" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/nbg-state"
          fi
      - name: Pin, deploy and verify the recorded ARM64 image through Coolify
        id: rollback
        env:
          NBG_STATE_FILE: ${{ runner.temp }}/nbg-state/receipt.json
          INLINE_SMOKE_USER_TOKEN: ${{ secrets.INLINE_SMOKE_USER_TOKEN }}
          INLINE_SMOKE_MCP_SECRET: ${{ secrets.INLINE_SMOKE_MCP_SECRET }}
          INLINE_SMOKE_OAUTH_TOKEN: ${{ secrets.INLINE_SMOKE_OAUTH_TOKEN }}
        run: bun --no-env-file scripts/ci/nbg-release.ts --rollback
      - name: Retain the rollback receipt even when verification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nbg-rollback-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nbg-state/receipt.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

  rollback_fly:
    name: Roll the public Fly Machines back to the recorded image
    needs: [validate, rollback_plan]
    # Independent of Nuremberg: the primary origin is restored as fast as possible.
    if: ${{ !cancelled() && inputs.rollback_to_plan && needs.rollback_plan.result == 'success' && needs.rollback_plan.outputs.fly == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      outcome: ${{ steps.replace.outputs.outcome }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET_IMAGE: ${{ needs.rollback_plan.outputs.fly_image }}
      TARGET_REVISION: ${{ needs.rollback_plan.outputs.fly_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.107"
      - name: Verify the recorded image is public and built from the recorded revision
        run: |
          set -euo pipefail
          [[ "$TARGET_IMAGE" =~ ^ghcr\.io/inline-chat/inline-server@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$TARGET_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/anonymous-registry"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-registry" docker pull --quiet "$TARGET_IMAGE" > /dev/null
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$TARGET_IMAGE")" = "$TARGET_REVISION"
      - name: Redeploy the recorded digest over the current public Machines
        id: replace
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl machine list --config server/fly.toml --json > "$RUNNER_TEMP/machines-before.json"
          # Unlike a release, a rollback accepts Machines that fail readiness.
          current=$(jq -ce -f scripts/ci/fly-release-machines-rollback.jq "$RUNNER_TEMP/machines-before.json")
          echo "count=$(jq -er '.count' <<< "$current")" >> "$GITHUB_OUTPUT"
          if jq -e --arg digest "${TARGET_IMAGE##*@}" --arg sha "$TARGET_REVISION" \
              '.digest == $digest and .revision == $sha' <<< "$current" > /dev/null; then
            if jq -e -f scripts/ci/fly-release-machines.jq "$RUNNER_TEMP/machines-before.json" > /dev/null 2>&1; then
              echo "::warning title=Nothing to roll back on Fly::Fly already serves the recorded baseline $TARGET_REVISION and passes readiness; the selected plan may not be the release you meant (see rollback_plan_run)."
              echo "outcome=already-current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Fly runs the recorded image but fails readiness; redeploying it."
          fi
          echo "outcome=published" >> "$GITHUB_OUTPUT"
          # The current main fly.toml supplies Machine configuration; only the image is rolled back.
          flyctl deploy --config server/fly.toml --image "$TARGET_IMAGE" \
            --only-machines "$(jq -er '.ids' <<< "$current")" --strategy bluegreen --ha=false \
            --signal SIGTERM --wait-timeout 5m --yes
      - name: Verify count, image revision, and service health
        env:
          COUNT: ${{ steps.replace.outputs.count }}
        run: |
          bash scripts/ci/fly-release-wait.sh "$RUNNER_TEMP/machines-after.json" "$COUNT" "${TARGET_IMAGE##*@}" "$TARGET_REVISION"
          printf 'Rolled Fly back to `%s` at `%s`; %s public Machine(s) passed Fly service checks.\n' \
            "$TARGET_REVISION" "$TARGET_IMAGE" "$COUNT" >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Smoke-test Fly directly and canonical readiness
        env:
          FLY_ORIGIN_IP: ${{ vars.FLY_ORIGIN_IP }}
          SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
          SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
          INLINE_SMOKE_USER_TOKEN: ${{ secrets.INLINE_SMOKE_USER_TOKEN }}
          INLINE_SMOKE_MCP_SECRET: ${{ secrets.INLINE_SMOKE_MCP_SECRET }}
          INLINE_SMOKE_OAUTH_TOKEN: ${{ secrets.INLINE_SMOKE_OAUTH_TOKEN }}
          # A rollback image may predate a probed route; only the base checks gate.
          INLINE_SMOKE_PROBES: advisory
        run: |
          set -euo pipefail
          bun --no-env-file scripts/ci/release-smoke.ts --origin fly --revision "$TARGET_REVISION" --ip "$FLY_ORIGIN_IP"
          # Canonical routing may still reach Nuremberg mid-rollback; check it without a revision.
          bun --no-env-file scripts/ci/release-smoke.ts --preflight --origin canonical

  summary:
    name: Release outcome
    needs: [validate, require_green, qualify, prepared, preflight, migrate, nuremberg, deploy, activate, rollback_plan, rollback_nuremberg, rollback_fly]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
      - name: Report the outcome per origin
        env:
          ORIGINS: ${{ inputs.origins }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          ROLLBACK: ${{ inputs.rollback_to_plan }}
          SKIP_GATE: ${{ inputs.skip_gate }}
          RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/ci/server-release-summary.sh
