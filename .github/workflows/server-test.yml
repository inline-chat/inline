name: Server Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/server-test.yml"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - ".oxlintignore"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/server-test.yml"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - ".oxlintignore"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server Typecheck, Lint, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Ensure public workspaces
        run: bash scripts/ci/ensure-public-workspaces.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protos (drift check)
        env:
          SKIP_SWIFT_PROTO: "1"
        run: |
          bun run generate:proto
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run linter
        run: cd server && bun lint

      - name: Run strict migration linter
        run: cd server && bun run lint:strict

      - name: Test migration lint rules
        run: cd server && bun run lint:rules

      - name: Type check
        run: cd server && bun typecheck

      - name: Type check Effect foundation
        run: cd server && bun run typecheck:effect

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
          echo "RESEND_API_KEY=re_ci_placeholder" >> $GITHUB_ENV

      - name: Run Effect tests
        run: cd server && bun run test:effect

      - name: Smoke test the Bun/Effect HTTP kernel
        run: cd server && bun run core:http-smoke

      - name: Check route manifest
        run: cd server && bun run contracts:routes

      - name: Check OpenAPI manifests
        run: cd server && bun run contracts:openapi

      - name: Run database migrations
        run: cd server && bun db:migrate

      - name: Smoke test the full core shadow
        run: cd server && bun run core:smoke

      - name: Run tests
        run: cd server && bun run test:bun
