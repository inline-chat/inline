name: Swift Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swift-tests.yml"
      - "apple/InlineKit/**"
      - "apple/InlineUI/**"
      - "apple/InlineIOSUI/**"
      - "apple/InlineMacUI/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/swift-tests.yml"
      - "apple/InlineKit/**"
      - "apple/InlineUI/**"
      - "apple/InlineIOSUI/**"
      - "apple/InlineMacUI/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift Tests (${{ matrix.package }})
    # GitHub's newest hosted macOS image. Xcode 27 can run on Tahoe 26.4+, so
    # the OS label does not need to wait for a macOS 27 runner image.
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: InlineKit
            path: apple/InlineKit
            test_args: --no-parallel
          - package: InlineUI
            path: apple/InlineUI
            test_args: ""
          - package: InlineIOSUI
            path: apple/InlineIOSUI
            test_args: ""
          - package: InlineMacUI
            path: apple/InlineMacUI
            test_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode (including betas)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Build ${{ matrix.package }}
        working-directory: ${{ matrix.path }}
        run: xcrun swift build

      - name: Test ${{ matrix.package }}
        working-directory: ${{ matrix.path }}
        run: xcrun swift test ${{ matrix.test_args }}
