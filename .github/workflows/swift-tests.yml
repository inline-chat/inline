name: Swift Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swift-tests.yml"
      - "apple/InlineKit/**"
      - "apple/InlineUI/**"
      - "apple/InlineIOSUI/**"
      - "apple/InlineMacUI/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/swift-tests.yml"
      - "apple/InlineKit/**"
      - "apple/InlineUI/**"
      - "apple/InlineIOSUI/**"
      - "apple/InlineMacUI/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan Swift Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select affected packages
        id: packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -eo pipefail

          packages=()

          add_package() {
            local candidate="$1"
            local package
            for package in "${packages[@]}"; do
              if [[ "$package" == "$candidate" ]]; then
                return
              fi
            done
            packages+=("$candidate")
          }

          add_all_packages() {
            add_package "InlineKit"
            add_package "InlineUI"
            add_package "InlineIOSUI"
            add_package "InlineMacUI"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA:-}"
          else
            base_sha="${PUSH_BASE_SHA:-}"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            || -z "$base_sha" \
            || "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}"; then
            add_all_packages
          else
            changed() {
              ! git diff --quiet "$base_sha" "$GITHUB_SHA" -- "$1"
            }

            if changed ".github/workflows/swift-tests.yml" \
              || changed "apple/InlineKit"; then
              add_all_packages
            else
              if changed "apple/InlineUI"; then
                add_package "InlineUI"
                add_package "InlineIOSUI"
                add_package "InlineMacUI"
              fi
              if changed "apple/InlineIOSUI"; then
                add_package "InlineIOSUI"
              fi
              if changed "apple/InlineMacUI"; then
                add_package "InlineMacUI"
              fi
            fi
          fi

          # The workflow-level path filter guarantees a relevant change. Fall
          # back to full coverage if GitHub introduces an unexpected event shape.
          if [[ ${#packages[@]} -eq 0 ]]; then
            add_all_packages
          fi

          json="["
          separator=""
          for package in "${packages[@]}"; do
            json+="${separator}\"${package}\""
            separator=","
          done
          json+="]"

          echo "packages=$json" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $json"

  test:
    name: Swift Tests (${{ matrix.package }})
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    # GitHub's newest hosted macOS image. Xcode 27 can run on Tahoe 26.4+, so
    # the OS label does not need to wait for a macOS 27 runner image.
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode (including betas)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Build ${{ matrix.package }}
        working-directory: apple/${{ matrix.package }}
        run: xcrun swift build --build-tests --disable-automatic-resolution

      - name: Test ${{ matrix.package }}
        working-directory: apple/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          args=(--skip-build --disable-automatic-resolution)
          if [[ "$PACKAGE" == "InlineKit" ]]; then
            args+=(--no-parallel)
          fi
          xcrun swift test "${args[@]}"
