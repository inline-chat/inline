name: InlineMetrics
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  InlineMetrics:
    type: application
    platform: macOS
    sources: [App, Shared, Views]
    dependencies:
      - target: InlineMetricsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.inline.tools.metrics
        PRODUCT_NAME: Inline Metrics
    info:
      path: Resources/App-Info.plist
      properties:
        CFBundleDisplayName: Inline Metrics
        LSApplicationCategoryType: public.app-category.business
        MetricsAppGroup: $(TeamIdentifierPrefix)chat.inline.metrics
        CFBundleURLTypes:
          - CFBundleURLName: chat.inline.tools.metrics
            CFBundleURLSchemes: [inline-metrics]
    entitlements:
      path: Resources/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)chat.inline.metrics
  InlineMetricsWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared, Views]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.inline.tools.metrics.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Resources/Widget-Info.plist
      properties:
        CFBundleDisplayName: Inline Metrics
        MetricsAppGroup: $(TeamIdentifierPrefix)chat.inline.metrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)chat.inline.metrics
schemes:
  InlineMetrics:
    build:
      targets:
        InlineMetrics: all
    run:
      config: Debug
