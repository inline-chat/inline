[package]
name = "inline-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Inline Protocol secure transport and generated Inline Schema types."
readme = "README.md"
build = "build.rs"
keywords = ["inline", "chat", "protobuf", "protocol", "cryptography"]
categories = ["api-bindings", "cryptography"]
documentation = "https://docs.rs/inline-protocol"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aes = "0.8.4"
cipher = "0.4.4"
hex-literal = "0.4.1"
num-bigint = "0.4.6"
prost.workspace = true
serde.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.8"
subtle = "2.6.1"

[dev-dependencies]
hex = "0.4.3"
serde_json.workspace = true

[build-dependencies]
prost-build.workspace = true
