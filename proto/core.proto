syntax = "proto3";

// --- Protocol Messages ---

message ClientMessage {
  uint64 id = 1;
  uint32 seq = 2;

  reserved 3;

  oneof body {
    ConnectionInit connection_init = 4;
    RpcCall rpc_call = 5;
    Ack ack = 6;
    Ping ping = 7;
  }
}

message ConnectionInit {
  string token = 1;

  // Build number of the client app
  optional int32 build_number = 2;

  // API layer, for specific API differentiation
  optional uint32 layer = 3;

  // Client version (semver)
  optional string client_version = 4;

  // OS version (semver)
  optional string os_version = 5;

  // Stable installation/device identifier. Realtime V3 authenticates the
  // enclosing request from the bound authorization key, not `token`.
  optional string device_id = 6;
  optional string device_name = 7;
  optional string client_type = 8;
  optional string time_zone = 9;
}

message ServerProtocolMessage {
  uint64 id = 1;

  reserved 2, 3;

  oneof body {
    ConnectionOpen connection_open = 4;
    RpcResult rpc_result = 5;
    RpcError rpc_error = 6;
    ServerMessage message = 7;
    Ack ack = 8;
    Pong pong = 9;
    ConnectionError connection_error = 10;
  }
}

message ServerMessage {
  reserved 1, 2, 3;

  oneof payload {
    UpdatesPayload update = 4;
    GridEvent grid = 5;
    BotEvent bot = 6;
  }
}

// Ephemeral bot-owned interactions. These events are not persisted in sync
// buckets and do not advance update sequences.
message BotEvent {
  oneof event {
    BotChatSettingsRequested chat_settings_requested = 1;
    BotChatSettingsItemInvoked chat_settings_item_invoked = 2;
  }
}

message UpdatesPayload { repeated Update updates = 1; }

message Ack { uint64 msg_id = 1; }

message ConnectionOpen {}

message ConnectionError {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    UNAUTHORIZED = 1;
    INVALID_AUTH = 2;
    SESSION_REVOKED = 3;
  }

  Reason reason = 1;
}

message Ping { uint64 nonce = 1; }

message Pong { uint64 nonce = 1; }

// --- Application Types ---

message InputPeer {
  reserved 1;
  oneof type {
    InputPeerSelf self = 2;
    InputPeerChat chat = 3;
    InputPeerUser user = 4;
  }
}

message InputPeerSelf {}

message InputPeerChat { int64 chat_id = 1; }

message InputPeerUser { int64 user_id = 1; }

message Peer {
  reserved 1;
  oneof type {
    PeerChat chat = 2;
    PeerUser user = 3;
  }
}

message PeerChat { int64 chat_id = 1; }

message PeerUser { int64 user_id = 1; }

// A caller-selected user or space boundary for scoped resources.
message InputScope {
  oneof type {
    InputScopeUser user = 1;
    InputScopeSpace space = 2;
  }
}

message InputScopeUser { int64 user_id = 1; }

message InputScopeSpace { int64 space_id = 1; }

// The resolved user or space boundary returned to clients.
message Scope {
  oneof type {
    ScopeUser user = 1;
    ScopeSpace space = 2;
  }
}

message ScopeUser { User user = 1; }

message ScopeSpace { Space space = 1; }

message BotAvatar {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    CODEX_ATLAS = 1;
  }

  Kind kind = 1;
  string display_name = 2;
  optional string description = 3;
  optional string cdn_url = 4;
  optional string file_unique_id = 5;
}

message BotPresenceState {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    HIDDEN = 1;
    IDLE = 2;
    HAPPY = 3;
    WAVING = 4;
    JUMPING = 5;
    FAILED = 6;
    WAITING = 7;
    RUNNING = 8;
    REVIEW = 9;
  }

  Kind kind = 1;
  optional string comment = 2;
}

message User {
  int64 id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string username = 4;
  optional string phone_number = 5;
  optional string email = 6;

  // If true, certain fields such as email or phone_number will be missing
  optional bool min = 7;

  optional UserStatus status = 8;

  optional UserProfilePhoto profile_photo = 9;

  // Last message ID
  // optional int64 last_msg_id = 10;

  // If true, the user has not completed the setup process
  optional bool pending_setup = 11;

  optional string time_zone = 12;

  optional bool bot = 13;

  optional BotAvatar bot_avatar = 14;

  optional string bio = 15;
}

message UserProfilePhoto {
  // ID of the photo
  optional int64 photo_id = 1;

  // Stripped thumbnail of the photo
  optional bytes stripped_thumb = 2;

  // Photo
  optional string cdn_url = 3;

  // Unique identifier of the file for cache invalidation
  optional string file_unique_id = 4;
}

message Dialog {
  Peer peer = 1;
  optional int64 space_id = 2;
  optional bool archived = 3;
  optional bool pinned = 4;
  optional int64 read_max_id = 5;
  optional int32 unread_count = 6;
  optional int64 chat_id = 7;
  optional bool unread_mark = 8;
  optional DialogNotificationSettings notification_settings = 9;
  // Deprecated wire field kept so old sidebar_visible=true does not decode as hidden.
  optional bool sidebar_visible = 10 [deprecated = true];
  // Hide noisy reply threads from normal chat lists; this is independent of sidebar inbox open state.
  optional bool chat_list_hidden = 13;
  // Stable sidebar inbox membership.
  optional bool open = 11;
  // Deprecated: sidebar ordering is now stored in order.
  optional int64 opened_date = 12;
  // Stable fractional order for normal sidebar inbox rows.
  optional string order = 14;
  // Stable fractional order for pinned sidebar rows.
  optional string pinned_order = 15;
  // Reply-thread automatic surfacing policy.
  optional DialogFollowMode follow_mode = 16;
  // Personal history-collapse boundary; messages at or below this ID stay hidden.
  optional int64 collapsed_max_id = 17;
  // Optional personal dialog folder. Unsupported clients continue rendering the dialog flat.
  optional int64 folder_id = 18;
}

message DialogFolder {
  int64 id = 1;
  optional string title = 2;
  // Uses the same fractional ordering coordinate as Dialog.order.
  string order = 3;
  // Optional emoji chosen by the user for the folder icon.
  optional string emoji = 4;
  // Presence is both pinned state and the coordinate in the shared Pinned lane.
  optional string pinned_order = 5;
}

enum DialogFollowMode {
  // Default relevance mode: mentions/replies and server heuristics may surface the thread.
  DIALOG_FOLLOW_MODE_UNSPECIFIED = 0;
  // Explicitly follow the thread; normal thread activity should surface it.
  FOLLOWING = 1;
  // Explicit opt-out; server auto-follow heuristics must not flip this back to following.
  // Mentions/replies may still surface the thread through normal relevance behavior.
  UNFOLLOWED = 2;
}

// Effective actions the current user may take on a chat.
message ChatPermissions {
  // Change the chat title, emoji, and other fields owned by messages.updateChatInfo.
  bool can_update_info = 1;
}

// A thread
message Chat {
  int64 id = 1;

  // Title
  string title = 2;

  // If it belongs to a space
  optional int64 space_id = 3;

  // Optional description
  optional string description = 4;

  // Emoji to show as the icon, can be null
  optional string emoji = 5;

  // If true, everyone in parent space can accces it
  optional bool is_public = 6;

  // Last message ID
  optional int64 last_msg_id = 7;

  // ID of the peer that this chat belongs to
  Peer peer_id = 8;

  // Date of creation
  optional int64 date = 9;

  // Creator user ID
  optional int64 created_by = 10;

  // Structural parent chat for linked subthreads.
  optional int64 parent_chat_id = 11;

  // Parent message anchor when this subthread is a reply thread.
  optional int64 parent_message_id = 12;

  // True when this thread has not been explicitly titled.
  optional bool untitled = 13;

  // Per-space thread number. Unset for home threads and pre-backfill space threads.
  optional int32 number = 14;

  // Effective permissions for the user this chat was encoded for.
  optional ChatPermissions permissions = 15;

  // Current sequence of this chat's update bucket.
  optional int32 seq = 16;
}

message MessageReplies {
  // Child chat ID for the reply thread.
  int64 chat_id = 1;

  // Number of messages currently in the reply thread.
  int32 reply_count = 2;

  // True when the viewer has durable unread state in the reply thread.
  bool has_unread = 3;

  // Recent distinct repliers in newest-first order. Limited server-side.
  repeated int64 recent_replier_user_ids = 4;
}

message MessageActions { repeated MessageActionRow rows = 1; }

message MessageActionRow { repeated MessageAction actions = 1; }

message MessageAction {
  // Bot-defined stable identifier for this button/action.
  string action_id = 1;

  // Display label.
  string text = 2;

  oneof action {
    MessageActionCallback callback = 3;
    MessageActionCopyText copy_text = 4;
  }
}

message MessageActionCallback {
  // Opaque payload parsed by bot.
  bytes data = 1;
}

message MessageActionCopyText {
  // Text copied client-side without notifying the bot.
  string text = 1;
}

message MessageActionResponseUi {
  oneof kind {
    MessageActionToast toast = 1;
    // Reserved for future expandability:
    // 2 => alert
    // 3 => open_url
  }
}

message MessageActionToast { string text = 1; }

message MessageService {
  oneof event {
    MessageServiceThreadBacklink thread_backlink = 1;
    MessageServicePinnedMessage pinned_message = 2;
  }
}

message MessageServiceThreadBacklink {
  optional int64 source_chat_id = 1;
  optional string source_title = 2;
}

message MessageServicePinnedMessage {
  // Per-chat message id of the pinned message, when known.
  optional int64 message_id = 1;
}

// Structural rich content projected alongside Message.message and
// Message.entities. Text-bearing blocks use UTF-16 ranges into Message.message;
// inline entities remain owned by Message.entities so there is one text/entity
// source of truth across legacy and rich renderers.
message BlockContent { repeated Block blocks = 1; }

message BlockText {
  int64 offset = 1;
  int64 length = 2;
  // Server-computed first-strong direction. Unset means the text contains no
  // strong character or that direction is owned by a containing block.
  optional bool is_rtl = 3;
}

message Block {
  oneof kind {
    BlockText paragraph = 1;
    BlockHeading heading = 2;
    BlockCode code = 3;
    BlockList list = 4;
    BlockSeparator separator = 5;
    BlockImage image = 6;
    BlockAlbum album = 7;
    BlockDisclosure disclosure = 8;
    BlockText footer = 9;
    BlockQuote quote = 10;
    BlockTable table = 11;
  }
}

message BlockHeading {
  BlockText text = 1;
  uint32 level = 2;
}

message BlockCode {
  // Code direction is intentionally not encoded; clients always render it LTR.
  BlockText text = 1;
  optional string language = 2;
}

message BlockList {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_UNORDERED = 1;
    KIND_ORDERED = 2;
  }

  Kind kind = 1;
  optional int64 start = 2;
  repeated BlockListItem items = 3;
  // Aggregate direction of the first strong text in the list. Items do not
  // carry an independent direction override.
  optional bool is_rtl = 4;
}

message BlockListItem {
  repeated Block children = 1;
  // Presence distinguishes a task-list item from an ordinary list item.
  // Older clients ignore this field and retain the ordinary list fallback.
  optional bool checked = 2;
}

message BlockSeparator {}

message BlockImageDimensions {
  uint32 width = 1;
  uint32 height = 2;
}

message BlockImagePending {
  optional BlockImageDimensions dimensions = 1;
  optional bytes stripped_thumbnail = 2;
}

message BlockImageUnavailable { optional BlockImageDimensions dimensions = 1; }

message BlockImage {
  BlockText alt = 1;

  oneof state {
    BlockImagePending pending = 2;
    Photo ready = 3;
    BlockImageUnavailable unavailable = 4;
  }
}

// Albums intentionally have no album-specific presentation properties. The
// codec coalesces consecutive images into chunks of at most ten ordinary image
// children.
message BlockAlbum { repeated BlockImage images = 1; }

message BlockDisclosure {
  enum Kind {
    KIND_DEFAULT = 0;
    KIND_PROGRESS = 1;
  }

  BlockText summary = 1;
  Kind kind = 2;
  optional bool initially_open = 3;
  repeated Block children = 4;
  optional bool is_rtl = 5;
}

message BlockQuote {
  repeated Block children = 1;
  optional bool is_rtl = 2;
}

message BlockTable {
  enum Alignment {
    ALIGNMENT_UNSPECIFIED = 0;
    ALIGNMENT_LEFT = 1;
    ALIGNMENT_CENTER = 2;
    ALIGNMENT_RIGHT = 3;
  }

  // The first row is the GFM header. All rows have exactly alignments.size
  // cells. Cells remain inline text ranges rather than nested block trees.
  repeated BlockTableRow rows = 1;
  repeated Alignment alignments = 2;
  optional bool is_rtl = 3;
}

message BlockTableRow { repeated BlockText cells = 1; }

message Message {
  int64 id = 1;

  // User ID of the sender
  int64 from_id = 2;

  // Peer ID of the recipient
  Peer peer_id = 3;

  // The "chat ID" of the message, for messages in a chat (deprecated)
  int64 chat_id = 4;

  // Message text
  optional string message = 5;

  // Whether the message is outgoing
  bool out = 6;

  // Date of the message
  int64 date = 7;

  // Whether user is mentioned
  optional bool mentioned = 8;

  // Message ID of the message being replied to
  optional int64 reply_to_msg_id = 9;

  // Media of the message
  optional MessageMedia media = 10;

  // Date of the last edit if edited
  optional int64 edit_date = 11;

  // ID of the grouped message if it's part of an album
  optional int64 grouped_id = 12;

  // Attachments of the message
  optional MessageAttachments attachments = 13;

  // Reactions of the message
  optional MessageReactions reactions = 14;

  // Whether the message is a sticker
  optional bool is_sticker = 15;
  optional bool has_link = 6000;

  // Rich text entities
  optional MessageEntities entities = 16;

  // Send mode for this message, if any
  optional MessageSendMode send_mode = 17;

  // Forward header info
  optional MessageFwdHeader fwd_from = 18;

  // Replies shown under the parent message row when this message has an
  // anchored child thread.
  optional MessageReplies replies = 19;

  // Optional interactive actions (bot messages only).
  optional MessageActions actions = 20;

  // Monotonic edit revision for the message. Increments on every edit.
  optional int64 rev = 21;

  // Typed service/system message metadata. Older clients ignore this and use
  // `message` as fallback text.
  optional MessageService service_message = 22;

  // Optional structural projection of message/entities. Older clients ignore
  // this field and keep rendering the unchanged flat projection.
  optional BlockContent block_content = 23;

  // Present only when this row is durably associated with an external agent
  // session. Raw provider identifiers remain server-private.
  optional AgentSessionMessageInfo agent_session = 24;
}

// Agent providers that implement Inline's session continuity contract. The
// numeric values are stored by the server; additions must be append-only.
enum AgentSessionProvider {
  AGENT_SESSION_PROVIDER_UNSPECIFIED = 0;
  AGENT_SESSION_PROVIDER_CODEX = 1;
  AGENT_SESSION_PROVIDER_CODEX_CLOUD = 2;
  AGENT_SESSION_PROVIDER_CLAUDE = 3;
  AGENT_SESSION_PROVIDER_OPEN_CODE = 4;
  AGENT_SESSION_PROVIDER_AMP = 5;
}

enum AgentSessionMessageRole {
  AGENT_SESSION_MESSAGE_ROLE_UNSPECIFIED = 0;
  AGENT_SESSION_MESSAGE_ROLE_USER = 1;
  AGENT_SESSION_MESSAGE_ROLE_ASSISTANT = 2;
}

enum AgentSessionMessageRelation {
  AGENT_SESSION_MESSAGE_RELATION_UNSPECIFIED = 0;
  // The provider owns this projected Inline row.
  AGENT_SESSION_MESSAGE_RELATION_IMPORTED = 1;
  // An existing Inline-authored row is linked to its provider echo.
  AGENT_SESSION_MESSAGE_RELATION_LINKED = 2;
}

message AgentSessionMessageInfo {
  // Stable Inline database identity, not the provider's session identifier.
  int64 agent_session_id = 1;
  AgentSessionProvider provider = 2;
  AgentSessionMessageRole role = 3;
  AgentSessionMessageRelation relation = 4;
}

enum MessageSendMode {
  MODE_UNSPECIFIED = 0;
  MODE_SILENT = 1;
}

message MessageFwdHeader {
  // Original chat or user peer
  Peer from_peer_id = 1;

  // Original sender user ID
  int64 from_id = 2;

  // Original message ID
  int64 from_message_id = 3;
}

message MessageEntities { repeated MessageEntity entities = 1; }

message MessageEntity {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_MENTION = 1;
    TYPE_URL = 2;
    TYPE_TEXT_URL = 3;
    TYPE_EMAIL = 4;
    TYPE_BOLD = 5;
    TYPE_ITALIC = 6;
    TYPE_USERNAME_MENTION = 7;
    TYPE_CODE = 8;
    TYPE_PRE = 9;
    TYPE_PHONE_NUMBER = 10;
    TYPE_THREAD = 11;
    TYPE_THREAD_TITLE = 12;
    TYPE_BOT_COMMAND = 13;
    TYPE_GROUP_MENTION = 14;
  }

  Type type = 1;
  int64 offset = 2;
  int64 length = 3;

  message MessageEntityMention {
    int64 user_id = 1;
    optional int64 agent_id = 2;
  }
  message MessageEntityGroupMention { int64 group_id = 1; }
  message MessageEntityTextUrl { string url = 1; }
  message MessageEntityPre { string language = 1; }
  message MessageEntityThread { int64 chat_id = 1; }
  message MessageEntityThreadTitle {
    int64 space_id = 1;
    string title = 2;
  }
  message MessageEntityBotCommand { int64 bot_user_id = 1; }

  oneof entity {
    MessageEntityMention mention = 4;
    MessageEntityTextUrl text_url = 5;
    MessageEntityPre pre = 6;
    MessageEntityThread thread = 7;
    MessageEntityThreadTitle thread_title = 8;
    MessageEntityGroupMention group_mention = 9;
    MessageEntityBotCommand bot_command = 10;
  }
}

message MessageReactions {
  // Reactions of the message
  repeated Reaction reactions = 1;
}

message Reaction {
  // Emoji of the reaction
  string emoji = 1;

  // ID of the user who reacted
  int64 user_id = 2;

  // ID of the message that this reaction is for
  int64 message_id = 3;

  // ID of the chat that this reaction is for
  int64 chat_id = 4;

  // Date of the reaction
  int64 date = 5;
}

message Member {
  enum Role {
    OWNER = 0;
    ADMIN = 1;
    MEMBER = 2;
  }

  int64 id = 1;
  int64 space_id = 2;
  int64 user_id = 3;
  optional Role role = 4;

  // Date of joining
  int64 date = 5;

  // Whether member can access public chats in the space
  bool can_access_public_chats = 6;
}

message Space {
  // ID
  int64 id = 1;

  // Name of the space
  string name = 2;

  // Whether the current user is the creator of the space
  bool creator = 3;

  // Date of creation
  int64 date = 4;

  // Whether this is a public community space with stricter member privacy.
  optional bool is_public = 5;

  // Public, case-insensitive address used for joining and links.
  optional string handle = 6;

  // Current sequence of this space's update bucket.
  optional int32 seq = 7;
}

message GetSpaceInput { int64 space_id = 1; }

message GetSpaceResult {
  // Authoritative Space snapshot, including its current sequence.
  Space space = 1;

  // The authenticated user's membership only; never the full member roster.
  Member membership = 2;

  SpaceSettings settings = 3;
}

// Durable Inline association between one bridge bot, one existing Inline
// thread, and one external agent session. Provider identifiers are not exposed.
message AgentSession {
  int64 id = 1;
  Peer peer_id = 2;
  int64 bot_user_id = 3;
  AgentSessionProvider provider = 4;
  optional int64 status_message_id = 5;
}

enum ConnectAgentSessionState {
  CONNECT_AGENT_SESSION_STATE_UNSPECIFIED = 0;
  CONNECT_AGENT_SESSION_STATE_CREATED = 1;
  CONNECT_AGENT_SESSION_STATE_ALREADY_CONNECTED = 2;
  CONNECT_AGENT_SESSION_STATE_CONNECTED_ELSEWHERE = 3;
}

message ConnectAgentSessionInput {
  // Existing Inline thread to adopt. The server never creates or moves it.
  InputPeer peer_id = 1;
  // Bridge bot that will synchronize this session. The caller must own it.
  int64 bot_user_id = 2;
  // Agent provider; future providers extend the enum without changing the RPC.
  AgentSessionProvider provider = 3;
  // Stable provider installation or account namespace. Opaque to Inline.
  string instance_ref = 4;
  // Stable provider task, thread, or session identifier. Opaque to Inline.
  string session_ref = 5;
  // Optional stable workspace, repository, or environment identity. It is
  // descriptive metadata and does not participate in session identity.
  optional string project_ref = 6;
  // Optional bot-authored message in peer_id used as the pinned connection card.
  optional int64 status_message_id = 7;
}

message ConnectAgentSessionResult {
  AgentSession agent_session = 1;
  ConnectAgentSessionState state = 2;
}

message AgentSessionConnection {
  AgentSession agent_session = 1;
  // Exact opaque provider namespace originally supplied at connection time.
  string instance_ref = 2;
  // Exact opaque provider task, thread, or session identity.
  string session_ref = 3;
  // Stable workspace/repository/environment identity, when one was supplied.
  optional string project_ref = 4;
}

message GetAgentSessionInput {
  // Inline conversation whose durable agent connection should be recovered.
  InputPeer peer_id = 1;
  // Bridge bot connection to look up. The authenticated caller must own it.
  int64 bot_user_id = 2;
}

message GetAgentSessionResult {
  // Absent when this bot has no agent session connected to the conversation.
  optional AgentSessionConnection connection = 1;
}

enum AgentSessionSyncMode {
  AGENT_SESSION_SYNC_MODE_UNSPECIFIED = 0;
  // Historical repair: visible in realtime but not counted as unread or pushed.
  AGENT_SESSION_SYNC_MODE_HISTORY = 1;
  // Current provider output: normal realtime visibility and unread semantics.
  AGENT_SESSION_SYNC_MODE_LIVE = 2;
}

message AgentSessionMessageUpsert {
  string text = 1;
  optional MessageEntities entities = 2;
  // Optional idempotent bot-send identity. For assistant history, the server
  // links the existing bot row when this random ID exists; otherwise it
  // imports a new row. This closes the send-before-ledger crash boundary.
  optional int64 assistant_random_id = 3;
}

message AgentSessionMessageLink {
  // Existing Inline-local message ID whose provider dispatch route is verified.
  int64 message_id = 1;
}

message AgentSessionMessageSync {
  AgentSessionMessageRole role = 1;
  // Stable provider item identity. Required for uncorrelated provider history.
  optional string item_ref = 2;
  // Stable Inline-to-provider input identity. It is canonical when present.
  optional string correlation_ref = 3;
  // Provider event time in Unix seconds. Required when creating an imported row.
  optional int64 source_date = 4;
  // Opaque stable content/provider revision used for idempotency.
  optional string revision_ref = 5;
  // Expected stored revision when changing an imported row.
  optional string base_revision_ref = 6;
  // True once the provider considers this item's content final.
  bool complete = 7;
  oneof operation {
    AgentSessionMessageUpsert upsert = 8;
    AgentSessionMessageLink link = 9;
  }
}

message SyncAgentSessionMessagesInput {
  // Durable Inline session ID returned by connectAgentSession.
  int64 agent_session_id = 1;
  // Selects history versus current-message side effects; it is not persisted.
  AgentSessionSyncMode mode = 2;
  // Ordered, atomic batch. The server currently accepts at most 100 operations.
  repeated AgentSessionMessageSync messages = 3;
}

enum AgentSessionMessageSyncState {
  AGENT_SESSION_MESSAGE_SYNC_STATE_UNSPECIFIED = 0;
  AGENT_SESSION_MESSAGE_SYNC_STATE_CREATED = 1;
  AGENT_SESSION_MESSAGE_SYNC_STATE_EDITED = 2;
  AGENT_SESSION_MESSAGE_SYNC_STATE_LINKED = 3;
  AGENT_SESSION_MESSAGE_SYNC_STATE_UNCHANGED = 4;
  AGENT_SESSION_MESSAGE_SYNC_STATE_STALE = 5;
  AGENT_SESSION_MESSAGE_SYNC_STATE_TOMBSTONED = 6;
  AGENT_SESSION_MESSAGE_SYNC_STATE_CONFLICT = 7;
}

message AgentSessionMessageSyncResult {
  // Zero-based position in the request batch.
  int32 index = 1;
  AgentSessionMessageSyncState state = 2;
  optional int64 message_id = 3;
  // Returned on compare-and-swap conflict so the bridge may repair explicitly.
  optional string current_revision_ref = 4;
}

message SyncAgentSessionMessagesResult {
  repeated AgentSessionMessageSyncResult messages = 1;
}

message JoinPublicSpaceInput {
  // Public space handle, with or without a leading @.
  string handle = 1;
}

message JoinPublicSpaceResult {
  Space space = 1;
  Member member = 2;
  bool already_member = 3;
}

message UserGroup {
  int64 id = 1;
  int64 space_id = 2;
  string name = 3;
  optional string description = 4;
  int32 member_count = 5;
  repeated int64 user_ids = 6;
  bool current_user_is_member = 7;
  int64 date = 8;
}

// Add reaction input
message AddReactionInput {
  // Emoji of the reaction
  string emoji = 1;

  // ID of the message that this reaction is for
  int64 message_id = 2;

  // ID of the peer that this reaction is for
  InputPeer peer_id = 3;
}

// Add reaction result
message AddReactionResult { repeated Update updates = 1; }

// Delete reaction input
message DeleteReactionInput {
  string emoji = 1;
  InputPeer peer_id = 2;
  int64 message_id = 3;
}

message DeleteReactionResult { repeated Update updates = 1; }

message MessageAttachments { repeated MessageAttachment attachments = 1; }

message MessageAttachment {
  // was message id
  reserved 1;

  // ID
  int64 id = 4;

  oneof attachment {
    MessageAttachmentExternalTask external_task = 2;
    UrlPreview url_preview = 3;
  }
}

message UrlPreview {
  // Compatibility summary of the preview media.
  enum MediaType {
    // No typed preview media was detected.
    MEDIA_TYPE_UNSPECIFIED = 0;

    // Metadata explicitly identifies this link as an article.
    MEDIA_TYPE_ARTICLE = 1;

    // The preview's primary media is an image.
    MEDIA_TYPE_IMAGE = 2;

    // The preview's primary media is a video or video player.
    MEDIA_TYPE_VIDEO = 3;

    // The preview's primary media is a document or downloadable file.
    MEDIA_TYPE_DOCUMENT = 4;

    // The preview's primary media is a provider embed.
    MEDIA_TYPE_EMBED = 5;
  }

  // ID of the URL preview row in our database.
  int64 id = 1;

  // URL of the link
  optional string url = 2;

  // Site name of the link
  optional string site_name = 3;

  // Title of the link
  optional string title = 4;

  // Description of the link
  optional string description = 5;

  // Image ID of the link
  optional Photo photo = 6;

  // Duration of the content
  optional int64 duration = 7;

  // Metadata-derived content type of the preview target
  optional MediaType media_type = 8;

  // Sanitized URL text for display only, not a fetch target.
  optional string display_url = 9;

  // Stable provider key from the preview pipeline, such as "youtube" or "loom".
  optional string provider = 10;

  // Author, channel, account, or publisher when provided by metadata.
  optional string author = 11;

  // Typed primary media for this preview.
  optional UrlPreviewMedia media = 12;

  // Server-provided layout hints that clients can adapt to available space.
  optional UrlPreviewLayout layout = 13;

  // Author, channel, account, or publisher avatar, separate from primary media.
  optional Photo author_photo = 14;

  // Native emoji used by the destination as its page icon, when provided.
  optional string icon_emoji = 15;
}

// Typed media attached to a URL preview.
message UrlPreviewMedia {
  // Exactly one primary preview media payload.
  oneof media {
    // Existing cached photo type, used for image links and static visual previews.
    Photo photo = 1;

    // Existing cached video type, used when we import and store the video ourselves.
    Video video = 2;

    // Existing cached document type, used for downloadable or file previews.
    Document document = 3;

    // Validated direct remote video stream that we do not own or cache as a Video yet.
    UrlPreviewExternalVideo external_video = 4;

    // Provider or player embed, such as YouTube or Loom when direct media is unavailable.
    UrlPreviewEmbed embed = 5;
  }
}

// Direct remote video metadata for playable previews without duplicating Video storage.
message UrlPreviewExternalVideo {
  // Validated public media stream URL, such as MP4 or HLS.
  string url = 1;

  // MIME type from metadata or response headers.
  optional string mime_type = 2;

  // Video width in pixels when known.
  optional int32 w = 3;

  // Video height in pixels when known.
  optional int32 h = 4;

  // Duration in seconds when known.
  optional int32 duration = 5;
}

// Provider/player embed metadata.
message UrlPreviewEmbed {
  // Validated provider or player URL.
  string url = 1;

  // Provider/player type, such as "iframe", "player", or "video".
  optional string type = 2;

  // Embed width in pixels when known.
  optional int32 w = 3;

  // Embed height in pixels when known.
  optional int32 h = 4;

  // Duration in seconds when known.
  optional int32 duration = 5;
}

// Layout hints for URL preview clients.
message UrlPreviewLayout {
  // True when metadata or dimensions support a large media preview.
  bool has_large_media = 1;

  // True when clients should prefer large media where appropriate.
  bool show_large_media = 2;
}

message MessageAttachmentExternalTask {
  // ID of external task in our database
  int64 id = 1;

  // ID of the task in the external application
  string task_id = 2;

  // Application name
  string application = 3;

  // Title of the task/issue
  string title = 4;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_BACKLOG = 1;
    STATUS_TODO = 2;
    STATUS_IN_PROGRESS = 3;
    STATUS_DONE = 4;
    STATUS_CANCELLED = 5;
  }

  // Status of the task
  Status status = 5;

  // Assigned user ID in Inline
  int64 assigned_user_id = 6;

  // URL of the task/issue in the external application
  string url = 7;

  // Number/code of the task/issue in the external application
  string number = 8;

  // Date of creation/addition in Inline
  int64 date = 9;
}

message MessageMedia {
  // WIP: add richer media/filtering metadata.

  oneof media {
    MessagePhoto photo = 1;
    MessageVideo video = 2;
    MessageDocument document = 3;
    MessageNudge nudge = 4;
    MessageVoice voice = 5;
  }
}

message MessagePhoto { Photo photo = 1; }

message MessageVideo { Video video = 1; }

message MessageDocument { Document document = 1; }

message MessageVoice { Voice voice = 1; }

// Nudge message (empty payload)
message MessageNudge {}

message Video {
  int64 id = 1;

  // Date of upload
  int64 date = 2;

  // Width of the video
  int32 w = 3;

  // Height of the video
  int32 h = 4;

  // Duration of the video in seconds
  int32 duration = 5;

  // File size
  int32 size = 6;

  // Thumbnail of the video
  optional Photo photo = 7;

  // CDN URL
  optional string cdn_url = 8;

  // True for GIF-style animation media stored as video.
  optional bool is_animated = 9;

  // True when the encoded video has an audio track.
  optional bool has_audio = 10;
}

message Document {
  int64 id = 1;

  // Original file name
  string file_name = 2;

  // MIME type of the file
  string mime_type = 3;

  // File size
  int32 size = 4;

  // CDN URL
  optional string cdn_url = 5;

  // Date of upload
  int64 date = 6;

  // Thumbnail of the document
  optional Photo photo = 7;
}

message Voice {
  int64 id = 1;

  // Date of upload
  int64 date = 2;

  // Duration of the voice message in seconds
  int32 duration = 3;

  // File size
  int32 size = 4;

  // MIME type of the file
  string mime_type = 5;

  // CDN URL
  optional string cdn_url = 6;

  // Waveform bytes for rendering
  bytes waveform = 7;
}

// Photo for message media, profile photo, space photo, or chat photo
message Photo {
  // ID
  int64 id = 1;

  // Date of upload
  int64 date = 2;

  repeated PhotoSize sizes = 3;

  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_JPEG = 1;
    FORMAT_PNG = 2;
  }

  // Format of the photo
  Format format = 4;

  // Unique identifier of the file
  optional string file_unique_id = 100;
}

message PhotoSize {
  /** Thumbnail type.
  Currently supported:
  - "b" - small box 140x140
  - "c" - medium box 320x320
  - "d" - regular box 800x800
  - "f" - large box 2560x2560
  - "s" - stripped (tiny version embedded in bytes)
  - "y" - ??
  - "x" - small cropped ??
  - "w" - medium cropped ??
  - "v" - ??
  */
  string type = 1;

  // Width in pixels
  int32 w = 2;

  // Height in pixels
  int32 h = 3;

  // File size
  int32 size = 4;

  // Bytes for stripped size used in blur thumbnails
  optional bytes bytes = 5;

  // CDN URL
  optional string cdn_url = 6;
}

