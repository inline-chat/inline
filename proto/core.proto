  int32 total_limit = 3;

  // optional inclusive upper bound for slicing
  int64 seq_end = 4;

  // Max number of updates to return in this response. The server caps pages at 100.
  int32 limit = 5;
}

message UpdateSidecars {
  repeated User users = 1;
  repeated Chat chats = 2;
  repeated Dialog dialogs = 3;
  repeated Space spaces = 4;
  repeated UserGroup user_groups = 5;
}

message SyncSkippedSequence {
  int64 seq = 1;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    IRRELEVANT_TO_BUCKET = 1;
    SNAPSHOT_REPAIR_REQUIRED = 2;
  }

  Reason reason = 2;
}

message GetUpdatesResult {
  reserved 8;
  reserved "core_sync_schema_revision";

  repeated Update updates = 1;

  // Final sequence of the updates slice
  int64 seq = 2;

  // Final date of the updates slice
  int64 date = 3;

  // Whether this is the final slice of updates
  optional bool final = 4;

  enum ResultType {
    RESULT_TYPE_UNSPECIFIED = 0;
    RESULT_TYPE_EMPTY = 1;
    RESULT_TYPE_SLICE = 2;
    RESULT_TYPE_TOO_LONG = 3;
  }

  // Type of the result
  ResultType result_type = 5;

  // Entities required to apply this update slice.
  UpdateSidecars sidecars = 6;

  // Explicit accounting for stored lossless records intentionally omitted
  // from `updates`. Every sequence through `seq` must be delivered or listed.
  repeated SyncSkippedSequence skipped_sequences = 7;
}

