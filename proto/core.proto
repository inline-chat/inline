  // ID of the space to invite to
  int64 space_id = 1;

  // Role of the user to invite
  // @deprecated
  // Member.Role role = 2;
  reserved 2;

  SpaceMemberRole role = 6;

  oneof via {
    // ID of the user to invite
    int64 user_id = 3;

    // Email of the user to invite
    string email = 4;

    // Phone number of the user to invite
    string phone_number = 5;
  }
}

message InviteToSpaceResult {
  User user = 1;
  Member member = 2;
  Chat chat = 3;
  Dialog dialog = 4;
}

message SearchUsersInput {
  string query = 1;
  optional int32 limit = 2;
}

message SearchUsersResult { repeated User users = 1; }

message InviteToInlineInput {
  oneof via {
    int64 user_id = 1;
    string email = 2;
    string phone_number = 3;
  }
}

message InviteToInlineResult {
  User user = 1;
  Chat chat = 2;
  Dialog dialog = 3;
}

message GetChatParticipantsInput { int64 chat_id = 1; }

message GetChatParticipantsResult {
  repeated ChatParticipant participants = 1;
  repeated User users = 2;
  repeated ChatParticipantGroup group_participants = 3;
  repeated UserGroup groups = 4;
}

message AddChatParticipantInput {
  int64 chat_id = 1;
  optional int64 user_id = 2;
  optional int64 group_id = 3;
}

message AddChatParticipantResult {
  optional ChatParticipant participant = 1;
  optional ChatParticipantGroup group_participant = 2;
  optional UserGroup group = 3;
  repeated User users = 4;
}

message RemoveChatParticipantInput {
  int64 chat_id = 1;
  optional int64 user_id = 2;
  optional int64 group_id = 3;
}

message RemoveChatParticipantResult {}

message UpdateChatVisibilityInput {
  int64 chat_id = 1;
  bool is_public = 2;
  repeated InputChatParticipant participants = 3;
}

message UpdateChatVisibilityResult { Chat chat = 1; }

message UpdateChatInfoInput {
  int64 chat_id = 1;
  optional string title = 2;
  optional string emoji = 3;
}

message UpdateChatInfoResult { Chat chat = 1; }

// Move a private thread between home (space_id unset) and a space (space_id set).
// v1 does NOT support cross-space moves or public threads.
message MoveThreadInput {
  int64 chat_id = 1;

  // Target space. If unset, moves to home.
  optional int64 space_id = 2;
}

message MoveThreadResult { Chat chat = 1; }

// Pin or unpin a message for everyone
message PinMessageInput {
  InputPeer peer_id = 1;
  int64 message_id = 2;
  bool unpin = 3;
}

message PinMessageResult { repeated Update updates = 1; }

// Apple only types
message DraftMessage {
  string text = 1;
  optional MessageEntities entities = 2;
}

message BotCapability {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    CHAT_SETTINGS = 1;
  }

  Kind kind = 1;
  uint32 version = 2;
}

message PeerBot {
  User bot = 1;
  repeated BotCapability capabilities = 2;
  repeated BotAgentProfile agents = 3;
}

message GetPeerBotsInput { InputPeer peer_id = 1; }

message GetPeerBotsResult {
  repeated PeerBot bots = 1;
  optional int64 suggested_bot_user_id = 2;
}

message GetMyBotCapabilitiesInput {}

message GetMyBotCapabilitiesResult { repeated BotCapability capabilities = 1; }

message SetMyBotCapabilitiesInput { repeated BotCapability capabilities = 1; }

message SetMyBotCapabilitiesResult { repeated BotCapability capabilities = 1; }

// A bot-owned, plain-text settings document. Bots must never include secrets,
// credentials, private prompts, or token material.
message BotChatSettingsDocument {
  uint32 version = 1;
  string revision = 2;
  repeated BotChatSettingsSection sections = 3;
}

message BotChatSettingsSection {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  repeated BotChatSettingsItem items = 4;
}

message BotChatSettingsItem {
  string id = 1;
  optional string label = 2;
  optional string description = 3;
  bool disabled = 4;
  optional string disabled_reason = 5;

  oneof control {
    BotChatSettingsToggle toggle = 6;
    BotChatSettingsSelect select = 7;
    BotChatSettingsInfo info = 8;
    BotChatSettingsButton button = 9;
    BotChatSettingsFolder folder = 10;
  }
}

message BotChatSettingsToggle { bool value = 1; }

message BotChatSettingsSelect {
  string value = 1;
  repeated BotChatSettingsSelectOption options = 2;
}

message BotChatSettingsSelectOption {
  string value = 1;
  string label = 2;
  optional string description = 3;
  bool disabled = 4;
}

message BotChatSettingsInfo {
  enum Tone {
    TONE_UNSPECIFIED = 0;
    NEUTRAL = 1;
    SUCCESS = 2;
    WARNING = 3;
    ERROR = 4;
  }

  // Plain text. A short wrapped paragraph is allowed for user guidance.
  string text = 1;
  Tone tone = 2;
}

message BotChatSettingsButton {}

// A host-local workspace selector. Values are opaque bot-owned identifiers;
// local filesystem paths must not be placed in this document or mutations.
message BotChatSettingsFolder {
  string value = 1;
  repeated BotChatSettingsFolderOption recent_folders = 2;
  string host_installation_id = 3;
  string host_label = 4;
  bool allows_local_picker = 5;
  // Ephemeral 127.0.0.1 endpoint metadata for a host-local native picker.
  // The capability is opaque, service-epoch scoped, and never a filesystem
  // path. Clients must probe this exact endpoint before opening a picker.
  optional uint32 local_picker_port = 6;
  optional string local_picker_capability = 7;
}

message BotChatSettingsFolderOption {
  string value = 1;
  string label = 2;
  optional string parent_hint = 3;
  bool disabled = 4;
}

message BotChatSettingsValue {
  oneof value {
    bool bool_value = 1;
    string string_value = 2;
  }
}

message BotChatSettingsProblem {
  enum Code {
    CODE_UNSPECIFIED = 0;
    UNAVAILABLE = 1;
    INVALID_VALUE = 2;
    STALE = 3;
    FAILED = 4;
    // Generated by Inline when a capable bot has no reachable connection or
    // does not answer in time.
    UNREACHABLE = 5;
  }

  Code code = 1;
  string message = 2;
  optional BotChatSettingsDocument current_document = 3;
}

message BotChatSettingsResponse {
  oneof result {
    BotChatSettingsDocument document = 1;
    BotChatSettingsProblem problem = 2;
  }
}

message RequestBotChatSettingsInput {
  InputPeer peer_id = 1;
  int64 bot_user_id = 2;
  uint32 version = 3;
}

message RequestBotChatSettingsResult { BotChatSettingsResponse response = 1; }

message InvokeBotChatSettingsItemInput {
  InputPeer peer_id = 1;
  int64 bot_user_id = 2;
  uint32 version = 3;
  string item_id = 4;
  optional BotChatSettingsValue value = 5;
  string document_revision = 6;
}

message InvokeBotChatSettingsItemResult { BotChatSettingsResponse response = 1; }

// Used only by an authenticated bot to resolve a pending settings request.
message AnswerBotChatSettingsInput {
  uint64 request_id = 1;
  BotChatSettingsResponse response = 2;
}

message AnswerBotChatSettingsResult {}

message BotChatSettingsRequested {
  uint64 request_id = 1;
  int64 chat_id = 2;
  int64 actor_user_id = 3;
  uint32 version = 4;
}

message BotChatSettingsItemInvoked {
  uint64 request_id = 1;
  int64 chat_id = 2;
  int64 actor_user_id = 3;
  uint32 version = 4;
  string item_id = 5;
  optional BotChatSettingsValue value = 6;
  string document_revision = 7;
}

// --- Realtime V3 application envelope ---
// Inline Protocol owns transport IDs, sequencing, acknowledgements, pings,
// replay handling, and authentication. These messages carry only the Inline
// Schema application contract inside inline.invoke/result/update.

message RealtimeV3Request {
  oneof body {
    RpcCall rpc = 1;
    AuthBeginRequest auth_begin = 2;
    AuthCompleteRequest auth_complete = 3;
    CreateHttpUploadRequest create_http_upload = 4 [deprecated = true];
    FinishHttpUploadRequest finish_http_upload = 5 [deprecated = true];
    ConnectionInit connection_init = 6;
    AuthBeginBrowserRequest auth_begin_browser = 7;
    AuthBrowserStatusRequest auth_browser_status = 8;
  }
}

message RealtimeV3Response {
  oneof body {
    RpcResult rpc_result = 1;
    RpcError rpc_error = 2;
    AuthBeginResult auth_begin = 3;
    AuthCompleteResult auth_complete = 4;
    CreateHttpUploadResult create_http_upload = 5 [deprecated = true];
    FinishHttpUploadResult finish_http_upload = 6 [deprecated = true];
    AuthBeginBrowserResult auth_begin_browser = 7;
    AuthBrowserStatusResult auth_browser_status = 8;
  }
}

message RealtimeV3Update { ServerMessage message = 1; }

message ClientInfo {
  optional string device_id = 1;
  optional string client_type = 2;
  optional string client_version = 3;
  optional string os_version = 4;
  optional string device_name = 5;
}

message AuthBeginRequest {
  oneof identifier {
    string email = 1;
    string phone_number = 2;
  }
  ClientInfo client = 3;
}

message AuthBeginResult {
  bytes challenge_id = 1;
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    EMAIL = 1;
    SMS = 2;
  }
  Delivery delivery = 2;
  int64 expires_at = 3;
  uint32 retry_after_seconds = 4;
}

message AuthCompleteRequest {
  bytes challenge_id = 1;
  string code = 2;
  optional string invite_code = 3;
  optional string time_zone = 4;
}

message AuthAuthorized {
  User user = 1;
  int64 account_session_id = 2;
}

message AuthInviteRequired {}

message AuthCompleteResult {
  oneof state {
    AuthAuthorized authorized = 1;
    AuthInviteRequired invite_required = 2;
  }
}

message AuthBeginBrowserRequest {
  ClientInfo client = 1;
}

message AuthBeginBrowserResult {
  string login_transaction_id = 1;
  string browser_url = 2;
  string verification_code = 3;
  int64 expires_at = 4;
}

message AuthBrowserStatusRequest {
  string login_transaction_id = 1;
}

message AuthBrowserStatusResult {
  oneof state {
    AuthBrowserPending pending = 1;
    AuthAuthorized authorized = 2;
    AuthBrowserCancelled cancelled = 3;
  }
}

message AuthBrowserPending {}
message AuthBrowserCancelled {}

enum HttpUploadKind {
  HTTP_UPLOAD_KIND_UNSPECIFIED = 0;
  PHOTO = 1;
  VIDEO = 2;
  DOCUMENT = 3;
  VOICE = 4;
}

message CreateHttpUploadRequest {
  string file_name = 1;
  string mime_type = 2;
  uint64 byte_count = 3;
  bytes sha256 = 4;
  HttpUploadKind kind = 5;
}

message CreateHttpUploadResult {
  bytes upload_id = 1;
  string upload_url = 2;
  bytes capability = 3;
  int64 expires_at = 4;
}

message FinishHttpUploadRequest { bytes upload_id = 1; }

message HttpUploadPending { uint32 retry_after_seconds = 1; }

message HttpUploadComplete { string file_unique_id = 1; }

message FinishHttpUploadResult {
  oneof state {
    HttpUploadPending pending = 1;
    HttpUploadComplete complete = 2;
  }
}

// --- Native resumable uploads ---
// These are ordinary RpcCall methods and may be carried by Realtime V2 or V3.

enum UploadKind {
  UPLOAD_KIND_UNSPECIFIED = 0;
  UPLOAD_KIND_PHOTO = 1;
  UPLOAD_KIND_VIDEO = 2;
  UPLOAD_KIND_DOCUMENT = 3;
  UPLOAD_KIND_VOICE = 4;
}

enum UploadStatus {
  UPLOAD_STATUS_UNSPECIFIED = 0;
  UPLOAD_STATUS_UPLOADING = 1;
  UPLOAD_STATUS_PROCESSING = 2;
  UPLOAD_STATUS_COMPLETE = 3;
  UPLOAD_STATUS_FAILED = 4;
  UPLOAD_STATUS_CANCELED = 5;
  UPLOAD_STATUS_EXPIRED = 6;
}

message UploadVideoMetadata {
  uint32 width = 1;
  uint32 height = 2;
  uint32 duration = 3;
  bool is_animated = 4;
  optional bool has_audio = 5;
}

message UploadVoiceMetadata {
  uint32 duration = 1;
  bytes waveform = 2;
}

message CreateUploadInput {
  bytes client_upload_id = 1;
  string file_name = 2;
  string mime_type = 3;
  uint64 byte_count = 4;
  bytes sha256 = 5;
  UploadKind kind = 6;
  optional string thumbnail_file_unique_id = 7;
  oneof metadata {
    UploadVideoMetadata video = 8;
    UploadVoiceMetadata voice = 9;
  }
}

message CreateUploadResult {
  bytes upload_id = 1;
  uint32 part_size = 2;
  uint32 part_count = 3;
  int64 expires_at = 4;
  repeated uint32 accepted_parts = 5;
}

message SaveUploadPartInput {
  bytes upload_id = 1;
  uint32 part_index = 2;
  bytes data = 3;
}

message SaveUploadPartResult { bool already_present = 1; }

message GetUploadStateInput { bytes upload_id = 1; }

message UploadComplete {
  string file_unique_id = 1;
  oneof media {
    Photo photo = 2;
    Video video = 3;
    Document document = 4;
    Voice voice = 5;
  }
}

message UploadFailure {
  enum Code {
    UPLOAD_FAILURE_CODE_UNSPECIFIED = 0;
    UPLOAD_FAILURE_INTEGRITY = 1;
    UPLOAD_FAILURE_INVALID_MEDIA = 2;
    UPLOAD_FAILURE_PROCESSING = 3;
    UPLOAD_FAILURE_STORAGE = 4;
  }
  Code code = 1;
  bool retryable = 2;
}

message GetUploadStateResult {
  UploadStatus status = 1;
  repeated uint32 accepted_parts = 2;
  optional UploadComplete complete = 3;
  optional UploadFailure failure = 4;
}

message FinishUploadInput { bytes upload_id = 1; }

message UploadMissingParts { repeated uint32 part_indices = 1; }

message UploadProcessing { uint32 retry_after_seconds = 1; }

message FinishUploadResult {
  oneof state {
    UploadMissingParts missing = 1;
    UploadProcessing processing = 2;
    UploadComplete complete = 3;
    UploadFailure failed = 4;
  }
}

message CancelUploadInput { bytes upload_id = 1; }

message CancelUploadResult {
  bool canceled = 1;
  bool already_terminal = 2;
}
