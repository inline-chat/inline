# Version-controlled, non-secret settings for the traffic-serving Machine.
# The dark validation Machine uses fly.dark-machine.json and has no Fly Proxy
# service. Supply this app and the immutable image explicitly during the
# reviewed cutover; this file does not create or select a Machine by itself.
app = "inline-api"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "45s"

# Deployment consumes an already tested image; it never builds the checkout.
# Override this sentinel with --image registry/repository@sha256:... .
[build]
  image = "REPLACE_WITH_IMMUTABLE_IMAGE_DIGEST"

[deploy]
  strategy = "immediate"
  # No release_command: run the same image's migrator as a controlled job.

[env]
  NODE_ENV = "production"
  PORT = "8000"
  # The only traffic-serving role. It owns the shared workers and schedulers.
  INLINE_PROCESS_ROLE = "all"
  # The public route terminates at Cloudflare. The origin secret remains a Fly
  # secret and is deliberately absent from this version-controlled config.
  INLINE_INGRESS_MODE = "cloudflare"
  INLINE_INGRESS_HOST = "api.inline.chat"
  INLINE_TRUSTED_CLIENT_IP_HEADER = "cf-connecting-ip"
  # Leave five seconds after the application's 40-second drain for Fly's
  # supervisor to complete termination.
  SHUTDOWN_TIMEOUT_MS = "40000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "5s"
    timeout = "3s"
    grace_period = "15s"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 6
  memory = "1536mb"

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]

# No release_command while migrations use an explicitly reviewed one-off job.
# A healthy check controls routing only; it does not fence the old writer or
# restart a process which is still running but unhealthy. See fly-deployment.md.
